---
- name: Converge
  hosts: all
  gather_facts: false
  vars:
    compose_service_test_greeting: hello from molecule
  pre_tasks:
    # Existing folders (TrueNAS datasets) with permissions the role must correct
    # only when the entry asks for them; mkdir leaves them alone on later runs
    - name: Create existing folders with loose permissions
      ansible.builtin.command:
        argv: [mkdir, -p, -m, "0777", "{{ compose_service_test_path }}/{{ item }}"]
        creates: "{{ compose_service_test_path }}/{{ item }}"
      loop: [Database, Kept]

    # An existing network that differs from its declaration below: the role must warn and leave it alone
    - name: Create a network that the role will find different
      community.docker.docker_network:
        name: molecule_test_drift

    # Stands in for Traefik, which the role connects to the stack's proxy network
    - name: Start a stand-in Traefik
      community.docker.docker_container:
        name: molecule_test_traefik
        image: busybox:1.37
        command: sleep 3600
        state: started
  roles:
    - role: compose_service
      vars:
        compose_service_name: molecule_test
        compose_service_directory: Molecule_test
        compose_service_user: "{{ lookup('ansible.builtin.pipe', 'id -u') }}"
        compose_service_group: "{{ lookup('ansible.builtin.pipe', 'id -g') }}"
        compose_service_mounted_files:
          - data.sqlite
        compose_service_directories:
          - data
          - Kept
          # Enforced on every deploy, even on an existing folder
          - path: Database
            owner: "{{ lookup('ansible.builtin.pipe', 'id -u') }}"
            group: "{{ lookup('ansible.builtin.pipe', 'id -g') }}"
            mode: "0700"
        compose_service_templates:
          - source: settings.json.j2
            destination: settings/settings.json
        compose_service_files:
          - source: config.yml
            destination: config/config.yml
          # The service reloads it itself: changing it must not restart the stack
          - source: "{{ compose_service_test_reloaded_source | default('reloaded_first.yml') }}"
            destination: config/reloaded.yml
            restart: false
        compose_service_external_networks:
          - name: molecule_test_database
            internal: true
          - name: molecule_test_drift
            internal: true
        compose_service_proxy: true
        compose_service_proxy_traefik: molecule_test_traefik
        compose_service_environment:
          PROXY_RULE: Host(`molecule.example`)
  post_tasks:
    - name: Check that the role reports the proxy network's subnets
      ansible.builtin.assert:
        that:
          - compose_service_proxy_subnets | length > 0
          - compose_service_proxy_subnets[0] is match('^[0-9a-f.:]+/[0-9]+$')
