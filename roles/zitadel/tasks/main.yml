---
- name: Reset the provisioning facts
  ansible.builtin.set_fact:
    zitadel_provisioned: false
    zitadel_organization_id: ""
    zitadel_temporary_passwords: {}
    zitadel_state_changed: false
    zitadel_client_ids: {}
    zitadel_client_secrets: {}
    zitadel_configured_in: {}
  delegate_to: localhost
  run_once: true

- name: Explain how to create the Zitadel credentials
  ansible.builtin.debug:
    msg:
      - "Zitadel is not provisioned: the automation token or the state passphrase is missing. Once:"
      - "1. Zitadel console (https://authentification.anneraud.fr) → in the ZITADEL organization, Users → Service Users → New,
        then Default settings → Managers → add it with the IAM_OWNER role"
      - "2. On that user, Personal Access Tokens → New, and copy the token"
      - "3. ansible-vault edit vault/authentification/vault.yml: set zitadel_automation_token to the token and zitadel_state_passphrase
        to a new random passphrase of at least 16 characters (openssl rand -base64 32)"
  delegate_to: localhost
  run_once: true
  when: zitadel_opentofu_token | length == 0 or zitadel_opentofu_state_passphrase | length == 0

- name: Provision the applications
  when:
    - zitadel_opentofu_token | length > 0
    - zitadel_opentofu_state_passphrase | length > 0
  delegate_to: localhost
  run_once: true
  block:
    # An apply without users would delete every one of them
    - name: Check that the users are listed
      ansible.builtin.assert:
        that: zitadel_opentofu_users | length > 0
        fail_msg: >-
          No users to provision. Set zitadel_users in vault/authentification/vault.yml
          (an empty list would delete every user).
        quiet: true

    - name: Check that the SMTP server is set
      ansible.builtin.assert:
        that: not zitadel_opentofu_smtp_enabled or zitadel_opentofu_smtp_host | length > 0
        fail_msg: >-
          No SMTP server. Set zitadel_smtp_host in vault/authentification/vault.yml
          (an empty host would delete Zitadel's SMTP provider), or zitadel_opentofu_smtp_enabled to false.
        quiet: true

    - name: Apply the OpenTofu configuration
      block:
        - name: Run the opentofu role
          ansible.builtin.include_role:
            name: opentofu
          vars:
            opentofu_project_path: "{{ zitadel_opentofu_project_path }}"
            opentofu_state_path: "{{ zitadel_opentofu_state_path }}"
            opentofu_variables: >-
              {{ zitadel_opentofu_variables
                 | combine({'users': zitadel_opentofu_users,
                            'smtp_host': zitadel_opentofu_smtp_host,
                            'smtp_user': zitadel_opentofu_smtp_user}) }}
            opentofu_secret_variables:
              zitadel_token: "{{ zitadel_opentofu_token }}"
              state_passphrase: "{{ zitadel_opentofu_state_passphrase }}"
              smtp_password: "{{ zitadel_opentofu_smtp_password }}"

        - name: Keep the apply's result
          ansible.builtin.set_fact:
            zitadel_apply: "{{ opentofu_apply }}"
          no_log: true

      # Also after an apply that failed halfway, which can change the state
      always:
        - name: Keep whether the state changed
          ansible.builtin.set_fact:
            zitadel_state_changed: "{{ opentofu_state_changed | default(false) }}"

    - name: Set the provisioning facts
      ansible.builtin.set_fact:
        zitadel_provisioned: true
        zitadel_organization_id: "{{ zitadel_apply.outputs.organization_id.value }}"
        zitadel_temporary_passwords: "{{ zitadel_apply.outputs.temporary_passwords.value }}"
        zitadel_client_ids: "{{ zitadel_apply.outputs.client_ids.value }}"
        zitadel_client_secrets: "{{ zitadel_apply.outputs.client_secrets.value }}"
        zitadel_configured_in: "{{ zitadel_apply.outputs.configured_in.value }}"
      no_log: true
