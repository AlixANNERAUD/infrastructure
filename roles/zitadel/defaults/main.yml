---
# Personal access token of the OpenTofu service account: in the ZITADEL
# organization, with the IAM_OWNER role (it creates the Anneraud organization)
zitadel_opentofu_token: "{{ zitadel_automation_token | default('') }}"

# Passphrase of the encrypted OpenTofu state (at least 16 characters)
zitadel_opentofu_state_passphrase: "{{ zitadel_state_passphrase | default('') }}"

# OpenTofu configuration describing the organization, its users and applications
zitadel_opentofu_project_path: "{{ playbook_dir }}/../../opentofu/zitadel"

# People of the organization, keyed by username; the role refuses to run
# without them, since OpenTofu would delete every user
zitadel_opentofu_users: "{{ zitadel_users | default({}) }}"

# SMTP2GO for Zitadel's emails; without a host, Zitadel sends none
zitadel_opentofu_smtp_host: "{{ zitadel_smtp_host | default('') }}"
zitadel_opentofu_smtp_user: "{{ zitadel_smtp_user | default('') }}"
zitadel_opentofu_smtp_password: "{{ zitadel_smtp_password | default('') }}"

# Extra OpenTofu variables, overriding the configuration's defaults and
# applications.auto.tfvars: {zitadel_domain: localhost, applications: {...}}
zitadel_opentofu_variables: {}
