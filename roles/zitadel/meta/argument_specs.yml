---
argument_specs:
  main:
    short_description: Provision the Anneraud Zitadel organization with OpenTofu
    description:
      - Runs tofu apply on opentofu/zitadel from the controller, then sets the facts zitadel_provisioned, zitadel_organization_id, zitadel_temporary_passwords,
        zitadel_client_ids, zitadel_client_secrets and zitadel_configured_in.
      - Without a token or a state passphrase, prints the one-time manual step and sets zitadel_provisioned to false.
    options:
      zitadel_opentofu_token:
        type: str
        no_log: true
        description: Personal access token of the IAM_OWNER service account in the ZITADEL organization.
      zitadel_opentofu_state_passphrase:
        type: str
        no_log: true
        description: Passphrase of the encrypted OpenTofu state, at least 16 characters.
      zitadel_opentofu_project_path:
        type: path
        description: Folder of the OpenTofu configuration.
      zitadel_opentofu_users:
        type: dict
        no_log: true
        description: People of the organization keyed by username (vault zitadel_users); the role fails when it is empty.
      zitadel_opentofu_smtp_host:
        type: str
        description: SMTP server as host:port (vault zitadel_smtp_host); empty configures no SMTP.
      zitadel_opentofu_smtp_user:
        type: str
        description: SMTP user (vault zitadel_smtp_user).
      zitadel_opentofu_smtp_password:
        type: str
        no_log: true
        description: SMTP password (vault zitadel_smtp_password), passed through the environment.
      zitadel_opentofu_variables:
        type: dict
        description: >-
          Extra OpenTofu variables (zitadel_domain, zitadel_port, zitadel_insecure, organization_name,
          organization_domain, state_path, applications).
