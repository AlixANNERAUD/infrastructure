---
argument_specs:
  main:
    short_description: Provision the Anneraud Zitadel organization with OpenTofu
    description:
      - Runs tofu apply on opentofu/zitadel from the controller, then sets the facts zitadel_provisioned,
        zitadel_organization_id, zitadel_temporary_passwords, zitadel_state_changed, zitadel_client_ids,
        zitadel_client_secrets and zitadel_configured_in.
      - Without a token or a state passphrase, prints the one-time manual step and sets zitadel_provisioned to false.
    options:
      zitadel_opentofu_token:
        type: str
        no_log: true
        description: Personal access token of the IAM_OWNER service account in the ZITADEL organization.
      zitadel_opentofu_state_passphrase:
        type: str
        no_log: true
        description: Passphrase of the encrypted OpenTofu state, at least 16 characters.
      zitadel_opentofu_project_path:
        type: path
        description: Folder of the OpenTofu configuration.
      zitadel_opentofu_users:
        type: dict
        no_log: true
        description: People of the organization keyed by username (vault zitadel_users); the role fails when it is empty.
      zitadel_opentofu_smtp_host:
        type: str
        description: SMTP server as host:port (vault zitadel_smtp_host); empty configures no SMTP.
      zitadel_opentofu_smtp_user:
        type: str
        description: SMTP user (vault zitadel_smtp_user).
      zitadel_opentofu_smtp_password:
        type: str
        no_log: true
        description: SMTP password (vault zitadel_smtp_password), passed through the environment.
      zitadel_opentofu_smtp_enabled:
        type: bool
        description: Whether Zitadel sends emails; when true (default), an empty zitadel_opentofu_smtp_host fails the role.
      zitadel_opentofu_state_path:
        type: path
        description: Encrypted state file, compared before and after the apply to set zitadel_state_changed.
      zitadel_opentofu_variables:
        type: dict
        description: >-
          Extra OpenTofu variables (zitadel_domain, zitadel_port, zitadel_insecure, organization_name,
          organization_domain, state_path, applications).
  login:
    short_description: Get a service's Zitadel login, provisioning the organization
    description:
      - For a service's playbook. Loads the Zitadel vault when present, provisions the organization (main), then sets
        zitadel_login_client_id and zitadel_login_client_secret for the service's .env.
      - Without the Zitadel credentials both are empty. When provisioning fails, the values of the previous deploy are
        kept, read from the service's .env.
    options:
      zitadel_login_application:
        type: str
        required: true
        description: The application's key in opentofu/zitadel/applications.auto.tfvars.
      zitadel_login_environment_file:
        type: path
        required: true
        description: The service's .env on the host, read for the previous deploy's values.
      zitadel_login_client_id_variable:
        type: str
        required: true
        description: Name of the client id variable in that .env.
      zitadel_login_client_secret_variable:
        type: str
        description: Name of the client secret variable in that .env; empty for PKCE clients.
      zitadel_login_vault_path:
        type: path
        description: The Zitadel vault (token, state passphrase, users, SMTP).
