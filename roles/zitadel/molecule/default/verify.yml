---
- name: Verify
  hosts: all
  gather_facts: false
  vars:
    zitadel_test_token: "{{ lookup('ansible.builtin.file', zitadel_test_token_path) }}"
    zitadel_test_changed_uri: https://grafana-changed.molecule.example/login/generic_oauth
  tasks:
    - name: Run the role
      ansible.builtin.include_role:
        name: zitadel
      vars:
        zitadel_opentofu_token: "{{ zitadel_test_token }}"
        zitadel_opentofu_state_passphrase: "{{ zitadel_test_state_passphrase }}"
        zitadel_opentofu_users: "{{ zitadel_test_users }}"
        zitadel_opentofu_variables: "{{ zitadel_test_variables }}"

    - name: Check the facts
      ansible.builtin.assert:
        that:
          - zitadel_provisioned
          - zitadel_client_ids.keys() | sort == ['grafana', 'nextcloud']
          - zitadel_client_ids.values() | select | list | length == 2
          - zitadel_client_secrets.keys() | list == ['nextcloud']
          - zitadel_client_secrets.nextcloud | length > 0
          - "zitadel_configured_in == {'nextcloud': 'Nextcloud → Administration → OpenID Connect'}"
          - not zitadel_apply.changed
          - zitadel_temporary_passwords.keys() | list == ['owner']
          - zitadel_temporary_passwords.owner | length >= 16
        quiet: true

    - name: Read the default organization
      ansible.builtin.uri:
        url: "{{ zitadel_test_url }}/admin/v1/orgs/default"
        headers:
          Authorization: "Bearer {{ zitadel_test_token }}"
      register: zitadel_test_default_organization
      no_log: true

    - name: Check that the created organization is the default one
      ansible.builtin.assert:
        that:
          - zitadel_organization_id | length > 0
          - zitadel_test_default_organization.json.org.id == zitadel_organization_id
          - zitadel_test_default_organization.json.org.name == 'Molecule'

    - name: List the organization's domains
      ansible.builtin.uri:
        url: "{{ zitadel_test_url }}/management/v1/orgs/me/domains/_search"
        method: POST
        headers:
          Authorization: "Bearer {{ zitadel_test_token }}"
          x-zitadel-orgid: "{{ zitadel_organization_id }}"
        body_format: json
        body: {}
      register: zitadel_test_domains
      no_log: true

    - name: Check that molecule.example is the primary, verified domain
      ansible.builtin.assert:
        that:
          - domain.isPrimary | default(false)
          - domain.isVerified | default(false)
      vars:
        domain: "{{ zitadel_test_domains.json.result | selectattr('domainName', 'equalto', 'molecule.example') | first | default({}) }}"

    - name: Read the organization's policies
      ansible.builtin.uri:
        url: "{{ zitadel_test_url }}/management/v1/policies/{{ item }}"
        headers:
          Authorization: "Bearer {{ zitadel_test_token }}"
          x-zitadel-orgid: "{{ zitadel_organization_id }}"
      loop: [login, password/complexity, lockout, domain, label]
      register: zitadel_test_policies
      no_log: true

    - name: Check the organization's own policies
      ansible.builtin.assert:
        that:
          - login.isDefault | default(false) == false
          - login.allowRegister | default(false) == false
          - login.allowExternalIdp | default(false) == false
          - login.forceMfa | default(false) == false
          - login.passwordlessType == 'PASSWORDLESS_TYPE_ALLOWED'
          - login.ignoreUnknownUsernames | default(false)
          - complexity.isDefault | default(false) == false
          - complexity.minLength | int == 12
          - not (complexity.hasUppercase | default(false))
          - lockout.maxPasswordAttempts | int == 10
          - domain.userLoginMustBeDomain | default(false)
          - not (domain.validateOrgDomains | default(false))
          - label.disableWatermark | default(false)
          - label.hideLoginNameSuffix | default(false)
      vars:
        policies: "{{ zitadel_test_policies.results | map(attribute='json') | map(attribute='policy') | list }}"
        login: "{{ policies[0] }}"
        complexity: "{{ policies[1] }}"
        lockout: "{{ policies[2] }}"
        domain: "{{ policies[3] }}"
        label: "{{ policies[4] }}"

    - name: List the organization's users
      ansible.builtin.uri:
        url: "{{ zitadel_test_url }}/management/v1/users/_search"
        method: POST
        headers:
          Authorization: "Bearer {{ zitadel_test_token }}"
          x-zitadel-orgid: "{{ zitadel_organization_id }}"
        body_format: json
        body: {}
      register: zitadel_test_users_found
      no_log: true

    - name: Remember the users' ids
      ansible.builtin.set_fact:
        zitadel_test_user_ids: "{{ zitadel_test_users_found.json.result | items2dict(key_name='userName', value_name='id') }}"

    - name: Check that both users exist
      ansible.builtin.assert:
        that: zitadel_test_user_ids.keys() | sort == ['invited', 'owner']

    - name: Read the owner's Nextcloud account
      ansible.builtin.uri:
        url: "{{ zitadel_test_url }}/management/v1/users/{{ zitadel_test_user_ids.owner }}/metadata/nextcloud_account"
        headers:
          Authorization: "Bearer {{ zitadel_test_token }}"
          x-zitadel-orgid: "{{ zitadel_organization_id }}"
      register: zitadel_test_metadata
      no_log: true

    - name: Check that the account id keeps its spaces and case
      ansible.builtin.assert:
        that: zitadel_test_metadata.json.metadata.value | b64decode == 'Owner TEST'

    - name: List the owner's grants
      ansible.builtin.uri:
        url: "{{ zitadel_test_url }}/management/v1/users/grants/_search"
        method: POST
        headers:
          Authorization: "Bearer {{ zitadel_test_token }}"
          x-zitadel-orgid: "{{ zitadel_organization_id }}"
        body_format: json
        body:
          queries:
            - userIdQuery:
                userId: "{{ zitadel_test_user_ids.owner }}"
      register: zitadel_test_grants
      no_log: true

    - name: Check the owner's roles on the project
      ansible.builtin.assert:
        that:
          - zitadel_test_grants.json.result | length == 1
          - zitadel_test_grants.json.result[0].projectName == 'Molecule'
          - zitadel_test_grants.json.result[0].roleKeys == ['vigie-admin']

    - name: List the organization's members
      ansible.builtin.uri:
        url: "{{ zitadel_test_url }}/management/v1/orgs/me/members/_search"
        method: POST
        headers:
          Authorization: "Bearer {{ zitadel_test_token }}"
          x-zitadel-orgid: "{{ zitadel_organization_id }}"
        body_format: json
        body: {}
      register: zitadel_test_members
      no_log: true

    - name: Check that only the owner owns the organization
      ansible.builtin.assert:
        that: >-
          zitadel_test_members.json.result | selectattr('roles', 'contains', 'ORG_OWNER')
          | map(attribute='userId') | list == [zitadel_test_user_ids.owner]

    - name: Remember the client ids
      ansible.builtin.set_fact:
        zitadel_test_client_ids: "{{ zitadel_client_ids }}"

    - name: Find the project in Zitadel
      ansible.builtin.uri:
        url: "{{ zitadel_test_url }}/management/v1/projects/_search"
        method: POST
        headers:
          Authorization: "Bearer {{ zitadel_test_token }}"
          x-zitadel-orgid: "{{ zitadel_organization_id }}"
        body_format: json
        body:
          queries:
            - nameQuery:
                name: Molecule
                method: TEXT_QUERY_METHOD_EQUALS
      register: zitadel_test_projects
      no_log: true

    - name: Check that there is one project
      ansible.builtin.assert:
        that: zitadel_test_projects.json.result | default([]) | length == 1

    - name: List the project's roles
      ansible.builtin.uri:
        url: "{{ zitadel_test_url }}/management/v1/projects/{{ zitadel_test_project_id }}/roles/_search"
        method: POST
        headers:
          Authorization: "Bearer {{ zitadel_test_token }}"
          x-zitadel-orgid: "{{ zitadel_organization_id }}"
        body_format: json
        body: {}
      vars:
        zitadel_test_project_id: "{{ zitadel_test_projects.json.result[0].id }}"
      register: zitadel_test_roles
      no_log: true

    - name: Check the project's roles
      ansible.builtin.assert:
        that: zitadel_test_roles.json.result | map(attribute='key') | list == ['vigie-admin']

    - name: List the project's applications
      ansible.builtin.uri:
        url: "{{ zitadel_test_url }}/management/v1/projects/{{ zitadel_test_projects.json.result[0].id }}/apps/_search"
        method: POST
        headers:
          Authorization: "Bearer {{ zitadel_test_token }}"
          x-zitadel-orgid: "{{ zitadel_organization_id }}"
        body_format: json
        body: {}
      register: zitadel_test_applications_found
      no_log: true

    - name: Check the project's applications
      ansible.builtin.assert:
        that:
          - applications.keys() | sort == ['grafana', 'nextcloud']
          - applications.grafana.clientId == zitadel_test_client_ids.grafana
          - applications.grafana.redirectUris == ['https://grafana.molecule.example/login/generic_oauth']
          - applications.grafana.postLogoutRedirectUris == ['https://grafana.molecule.example/login']
          - applications.grafana.authMethodType == 'OIDC_AUTH_METHOD_TYPE_NONE'
          - applications.nextcloud.clientId == zitadel_test_client_ids.nextcloud
          - applications.nextcloud.redirectUris == ['https://nextcloud.molecule.example/apps/user_oidc/code']
          - applications.nextcloud.authMethodType | default('OIDC_AUTH_METHOD_TYPE_BASIC') == 'OIDC_AUTH_METHOD_TYPE_BASIC'
      vars:
        applications: "{{ zitadel_test_applications_found.json.result | items2dict(key_name='name', value_name='oidcConfig') }}"

    - name: Check that the state file exists
      ansible.builtin.stat:
        path: "{{ zitadel_test_state_path }}"
      register: zitadel_test_state

    - name: Count the client secret in the state file
      ansible.builtin.command:
        argv: [grep, --count, --fixed-strings, --, "{{ zitadel_client_secrets.nextcloud }}", "{{ zitadel_test_state_path }}"]
      register: zitadel_test_secret_count
      changed_when: false
      failed_when: zitadel_test_secret_count.rc > 1
      no_log: true

    - name: Check that the state is encrypted
      ansible.builtin.assert:
        that:
          - zitadel_test_state.stat.exists
          - zitadel_test_secret_count.stdout == '0'
          - "'encrypted_data' in lookup('ansible.builtin.file', zitadel_test_state_path)"

    - name: Run the role with a changed redirect URI
      ansible.builtin.include_role:
        name: zitadel
      vars:
        zitadel_opentofu_token: "{{ zitadel_test_token }}"
        zitadel_opentofu_state_passphrase: "{{ zitadel_test_state_passphrase }}"
        zitadel_opentofu_users: "{{ zitadel_test_users }}"
        zitadel_opentofu_variables: >-
          {{ zitadel_test_variables | combine({'applications': {'grafana': {'redirect_uris': [zitadel_test_changed_uri]}}},
             recursive=true) }}

    - name: Read the changed application
      ansible.builtin.uri:
        url: "{{ zitadel_test_url }}/management/v1/projects/{{ zitadel_test_projects.json.result[0].id }}/apps/_search"
        method: POST
        headers:
          Authorization: "Bearer {{ zitadel_test_token }}"
          x-zitadel-orgid: "{{ zitadel_organization_id }}"
        body_format: json
        body: {}
      register: zitadel_test_changed
      no_log: true

    - name: Check that the application was updated in place
      ansible.builtin.assert:
        that:
          - zitadel_client_ids == zitadel_test_client_ids
          - grafana.clientId == zitadel_test_client_ids.grafana
          - grafana.redirectUris == [zitadel_test_changed_uri]
      vars:
        grafana: "{{ (zitadel_test_changed.json.result | selectattr('name', 'equalto', 'grafana') | first).oidcConfig }}"

    - name: List the users after the change
      ansible.builtin.uri:
        url: "{{ zitadel_test_url }}/management/v1/users/_search"
        method: POST
        headers:
          Authorization: "Bearer {{ zitadel_test_token }}"
          x-zitadel-orgid: "{{ zitadel_organization_id }}"
        body_format: json
        body: {}
      register: zitadel_test_users_after
      no_log: true

    - name: Check that the users were not recreated
      ansible.builtin.assert:
        that: (zitadel_test_users_after.json.result | items2dict(key_name='userName', value_name='id')) == zitadel_test_user_ids

    - name: Run the role without users
      block:
        - name: Run the role with an empty user list
          ansible.builtin.include_role:
            name: zitadel
          vars:
            zitadel_opentofu_token: "{{ zitadel_test_token }}"
            zitadel_opentofu_state_passphrase: "{{ zitadel_test_state_passphrase }}"
            zitadel_opentofu_users: {}
            zitadel_opentofu_variables: "{{ zitadel_test_variables }}"

        - name: Fail when the role went on without users
          ansible.builtin.fail:
            msg: The role applied with an empty user list
      rescue:
        - name: Check that the role refused before applying
          ansible.builtin.assert:
            that: "'zitadel_users' in ansible_failed_result.msg"


    - name: Run the role without a token
      ansible.builtin.include_role:
        name: zitadel
      vars:
        zitadel_opentofu_token: ""
        zitadel_opentofu_state_passphrase: "{{ zitadel_test_state_passphrase }}"
        zitadel_opentofu_users: "{{ zitadel_test_users }}"
        zitadel_opentofu_variables: "{{ zitadel_test_variables }}"

    - name: Check that the role skipped provisioning
      ansible.builtin.assert:
        that:
          - not zitadel_provisioned
          - zitadel_client_ids == {}
          - zitadel_client_secrets == {}
