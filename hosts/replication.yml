---
# Clients trigger their TrueNAS replication task on Bruxelles over SSH, with a
# dedicated replication account and key. On Bruxelles, each client key may only
# run run-replication.sh with its own task identifier, and the TrueNAS API key
# stays there.
- name: Set up replication clients
  hosts: replication
  become: true
  vars:
    replication_user: replication
    replication_home: /var/lib/replication
    replication_service: bruxelles-replicate
  vars_files:
    - ../vault/ansible/vault.yml
  tasks:
    - name: Create the replication account
      ansible.builtin.user:
        name: "{{ replication_user }}"
        system: true
        home: "{{ replication_home }}"
        create_home: true
        shell: /usr/sbin/nologin
        password_lock: true
        state: present

    - name: Create the replication SSH folder
      ansible.builtin.file:
        path: "{{ replication_home }}/.ssh"
        state: directory
        owner: "{{ replication_user }}"
        group: "{{ replication_user }}"
        mode: "0700"

    - name: Generate the replication key
      ansible.builtin.command:
        argv: [ssh-keygen, -t, ed25519, -N, "", -q, -C, "replication@{{ inventory_hostname }}", -f, "{{ replication_home }}/.ssh/id_ed25519"]
        creates: "{{ replication_home }}/.ssh/id_ed25519"

    - name: Give the replication key to its account
      ansible.builtin.file:
        path: "{{ replication_home }}/.ssh/{{ item }}"
        owner: "{{ replication_user }}"
        group: "{{ replication_user }}"
      loop:
        - id_ed25519
        - id_ed25519.pub

    - name: Read the replication public key
      ansible.builtin.slurp:
        src: "{{ replication_home }}/.ssh/id_ed25519.pub"
      register: replication_public_key

    # yamllint disable rule:line-length
    - name: Create the replication service
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ replication_service }}.service"
        mode: "0644"
        content: |
          [Unit]
          Description=Trigger the TrueNAS replication task on Bruxelles
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=oneshot
          # Bruxelles answers when its task ends, with its result: a task can take hours
          TimeoutStartSec=infinity
          # The key is bound to this host's task on Bruxelles, so no command is sent.
          # systemd-inhibit keeps the host from sleeping or shutting down until the
          # task ends; it runs as root, which logind lets take the lock without
          # polkit, and ssh runs as the replication account. The keepalives end ssh
          # when Bruxelles can no longer be reached
          ExecStart=/usr/bin/systemd-inhibit --what=sleep:shutdown --mode=block --who="Bruxelles replication" --why="Receiving the snapshots of Bruxelles" /usr/sbin/runuser -u {{ replication_user }} -- /usr/bin/ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=30 -o ServerAliveCountMax=4 {{ replication_user }}@{{ hostvars['bruxelles'].ansible_host }}
    # yamllint enable rule:line-length

    - name: Create the replication timer
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ replication_service }}.timer"
        mode: "0644"
        content: |
          [Unit]
          Description=Run the Bruxelles replication twice a day

          [Timer]
          OnCalendar=*-*-* 00/12:00:00
          Persistent=true
          RandomizedDelaySec=5min

          [Install]
          WantedBy=timers.target

    - name: Enable the replication timer
      ansible.builtin.systemd:
        name: "{{ replication_service }}.timer"
        state: started
        enabled: true
        daemon_reload: true

# TrueNAS keeps its users in its own database and rewrites their files from it:
# the replication account and its authorized keys are set through its API
# (midclt), never in /etc or ~/.ssh
- name: Set up replication on Bruxelles
  hosts: bruxelles
  become: true
  vars:
    replication_user: replication
    replication_directory: "{{ services_root }}/Replication"
  vars_files:
    - ../vault/ansible/vault.yml
    - ../vault/replication/vault.yml
  tasks:
    # Holds no secret: the API key is in its own file, readable by the replication account only
    - name: Create the replication folder
      ansible.builtin.file:
        path: "{{ replication_directory }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Install the forced command
      ansible.builtin.copy:
        dest: "{{ replication_directory }}/run-replication.sh"
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/sh
          # Forced command of the replication SSH keys: runs one TrueNAS replication
          # task and waits for its end. The client gets the result as the exit code
          # and the progress on its standard error (in its journal). Local users of
          # Bruxelles can see the API key in the process list while the task runs
          set -eu
          case "${1:-}" in
              ''|*[!0-9]*) echo "Usage: run-replication.sh <task identifier>" >&2; exit 1 ;;
          esac
          exec midclt -K "$(cat {{ replication_directory }}/api_key)" call --job --job-print description replication.run "$1"

    - name: Read the replication account
      ansible.builtin.command:
        argv: [midclt, call, user.query, "{{ [['username', '=', replication_user]] | to_json }}"]
      register: replication_accounts
      changed_when: false
      check_mode: false

    - name: List the replication clients
      ansible.builtin.set_fact:
        replication_clients: >-
          {{ replication_clients | default([]) + [{
               'name': item,
               'identifier': hostvars[item].bruxelles_replication_identifier,
               'public_key': hostvars[item].replication_public_key.content | b64decode | trim
                             if hostvars[item].replication_public_key is defined else ''}] }}
      loop: "{{ groups['replication'] }}"

    - name: Build the authorized keys
      ansible.builtin.include_tasks: replication/tasks/authorized_keys.yml
      vars:
        replication_current_keys: >-
          {{ (replication_account.sshpubkey | default('', true)).splitlines() | map('trim') | reject('equalto', '') | list
             if replication_account | length > 0 else [] }}
        replication_account: "{{ replication_accounts.stdout | from_json | first | default({}) }}"

    - name: Warn about the clients whose key was not read
      ansible.builtin.debug:
        msg: >-
          Could not read the key of {{ replication_unread_clients | join(', ') }}: their current line is kept if
          it names the same task, otherwise they have none. Run the playbook again when they are switched on
      when: replication_unread_clients | length > 0

    # The home folder holds the authorized keys, which TrueNAS writes there:
    # it must be on a pool. The forced command runs through the account's shell
    - name: Create the replication account
      ansible.builtin.command:
        argv:
          - midclt
          - call
          - user.create
          - "{{ replication_account | to_json }}"
      changed_when: true
      when: replication_accounts.stdout | from_json | length == 0
      vars:
        replication_account:
          username: "{{ replication_user }}"
          full_name: Replication clients (hosts/replication.yml)
          group_create: true
          home: "{{ replication_directory }}"
          home_create: true
          shell: /usr/bin/sh
          password_disabled: true
          smb: false
          sshpubkey: "{{ replication_authorized_keys | join('\n') }}"

    - name: Set the replication account's authorized keys
      ansible.builtin.command:
        argv:
          - midclt
          - call
          - user.update
          - "{{ replication_account.id }}"
          - "{{ {'sshpubkey': replication_authorized_keys | join('\n')} | to_json }}"
      changed_when: true
      vars:
        replication_account: "{{ replication_accounts.stdout | from_json | first | default({}) }}"
        replication_current_keys: >-
          {{ (replication_account.sshpubkey | default('', true)).splitlines() | map('trim') | reject('equalto', '') | list }}
      when:
        - replication_account | length > 0
        - replication_current_keys | sort != replication_authorized_keys | sort

    - name: Store the TrueNAS API key
      ansible.builtin.copy:
        dest: "{{ replication_directory }}/api_key"
        content: "{{ bruxelles_api_key }}"
        owner: "{{ replication_user }}"
        group: "{{ replication_user }}"
        mode: "0400"
      no_log: true
