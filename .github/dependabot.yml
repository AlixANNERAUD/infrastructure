---
# Dependency updates, grouped per ecosystem into one weekly PR each.
# Ansible collections (requirements.yml), .python-version and OpenTofu itself
# (mise.toml) are not supported by Dependabot and are updated by hand.
version: 2
updates:
  - package-ecosystem: docker-compose
    directories:
      - /services/*
      - /roles/*/molecule/*
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    groups:
      docker-compose:
        patterns: ["*"]
    labels: [dependencies, docker]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    groups:
      github-actions:
        patterns: ["*"]
    labels: [dependencies, github-actions]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    groups:
      python-tooling:
        patterns: ["*"]
    labels: [dependencies, python]

  # Providers of the OpenTofu configurations, and their lock files. A new
  # provider can change what the next apply does: plan before merging
  - package-ecosystem: opentofu
    directories:
      - /opentofu/*
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Europe/Paris
    groups:
      opentofu:
        patterns: ["*"]
    labels: [dependencies, opentofu]
