---
# Networks Ansible connects from: the Houlme and Rouen LANs and the Netbird
# VPN (see the website's network page). The ansible account's SSH key only
# works from these.
automation_ssh_sources:
  - 192.168.0.0/24
  - 192.168.1.0/24
  - 100.64.0.0/16

# Personal accounts still allowed to log in over SSH, besides ansible
ssh_administrators:
  - alix_anneraud

# Account Ansible connects with, and the keys authorized for it: the laptop's,
# plus the other controllers' (Semaphore's public key, printed by
# services/deploiement/deploy.yml), which run on Bruxelles. Only these keys are
# accepted. Every key works from automation_ssh_sources; on TrueNAS (Bruxelles)
# the controllers' keys also work from the proxy network, where their
# containers connect from (see hosts/bootstrap.yml).
automation_user: ansible
# (a public key, written here so that Semaphore can run hosts/bootstrap.yml too)
automation_laptop_public_key: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIH2a6tQP6NqnRvRMzeJxyavYhCXuLmU3JWgHhmMp6UxP ansible@helsinki.anneraud.fr
automation_additional_public_keys: []
automation_public_keys: "{{ [automation_laptop_public_key] + automation_additional_public_keys }}"
# Their authorized_keys lines on the managed hosts, restricted to the networks above
automation_authorized_keys: >-
  {{ automation_public_keys | map('regex_replace', '^', 'from="' ~ (automation_ssh_sources | join(',')) ~ '" ') | list }}

# Networks of the internal-allowlist middleware (services/proxy/policy.yml),
# read from there so that CrowdSec's allowlist and its bouncer trust exactly
# the networks Traefik lets into internal routes: the LANs and the VPNs
internal_networks: >-
  {{ (lookup('ansible.builtin.file', inventory_dir ~ '/../services/proxy/policy.yml') | from_yaml)
     .http.middlewares['internal-allowlist'].ipAllowList.sourceRange }}

# Traefik checks every request against CrowdSec (services/protection) only on
# the hosts of the protection group: elsewhere there is no engine to ask
protection_enabled: "{{ inventory_hostname in groups['protection'] }}"

# Clients CrowdSec never bans and its bouncer never refuses, besides
# internal_networks: Docker's private range. Containers that reach a host's
# public names (Home Assistant on Bruxelles) come back through Traefik from
# their network's gateway; the internet cannot use these addresses
protection_trusted_networks: "{{ internal_networks + ['172.16.0.0/12'] }}"

# Public names whose addresses CrowdSec never bans, resolved by CrowdSec itself
# each time a scenario triggers (services/protection/trusted_hosts.yaml.j2), so
# a new address is trusted as soon as the DNS follows it. An IPv6 address
# trusts its whole /64. Bruxelles' is the home's (dynamic, kept up to date by
# its DDNS updater): devices of the LAN reach Bruxelles' public names through
# the router from it, and every Netbird client at home reaches Luxembourg's
# Netbird server from it. Luxembourg's: Gatus checks Bruxelles' public routes
# from it
protection_trusted_hosts:
  - global.bruxelles.anneraud.fr
  - global.luxembourg.anneraud.fr

# Ranges Cloudflare proxies from, https://www.cloudflare.com/ips/ (2026-10-30)
cloudflare_networks:
