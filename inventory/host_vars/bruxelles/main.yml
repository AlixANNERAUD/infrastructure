---
# Home TrueNAS server
ansible_host: local.bruxelles.anneraud.fr
ansible_user: ansible
ansible_python_interpreter: /usr/bin/python3
local_dns_host: local.bruxelles.anneraud.fr
global_dns_host: global.bruxelles.anneraud.fr

# Compose stacks live on the encrypted dataset, behind Traefik
services_root: /mnt/Donnees/Applications_chiffrees
proxy_network: proxy

# Host and container metrics (services/metriques), scraped by Vigie from
# Luxembourg over Netbird through Traefik, behind the internal allowlist, at
# https://<metriques_host>/node/metrics and /containers/metrics. The
# *.bruxelles.anneraud.fr wildcard certificate covers the name
metriques_directory: Metriques
metriques_host: metriques.bruxelles.anneraud.fr

# Traefik's access log shipper (services/journaux), sending to Vigie on
# Luxembourg over Netbird through Traefik, behind the internal allowlist
journaux_directory: Journaux
