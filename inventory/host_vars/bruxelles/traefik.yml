---
# Bruxelles routes, rendered by services/proxy/routes.yml.j2 into dynamic/routes.yml
traefik_directory: Traefik
traefik_dashboard_host: traefik.bruxelles.anneraud.fr
traefik_federation_publish: "127.0.0.1:8448:8448"

# Rate limit of the login requests of public routes (rate_limit on a route or
# one of its paths): POST requests to the given path prefixes, matched without
# case, get their own router with a token bucket per client address (an IPv6
# client counts as its /64), answering 429 once it is empty. Only logins are
# limited, so the many requests of app sync (Nextcloud, Jellyfin, Home
# Assistant, Bitwarden clients) are not; the apps' own throttling still applies.
# Limits are YAML anchors merged into each rate_limit.
# A burst of 10 attempts, then one every 6 s
traefik_login_rate_limit: &login_rate_limit
  average: 10
  period: 1m
  burst: 10
# For logins that post several requests: a burst of 20, then one every 2 s
traefik_busy_login_rate_limit: &busy_login_rate_limit
  average: 30
  period: 1m
  burst: 20

traefik_routes:
  - name: paperless
    hosts: [archive.anneraud.fr]
    url: http://ix-paperless-ngx-paperless-1:8000
    internal: true
  - name: truenas
    hosts: [bruxelles.anneraud.fr]
    url: https://192.168.0.21:1443
    internal: true
    insecure_backend: true
  - name: firefly
    hosts: [finances.anneraud.fr]
    url: http://ix-firefly-iii-firefly-iii-1:8080
    internal: true
  - name: firefly-importer
    hosts: [importeur-finances.anneraud.fr]
    url: http://ix-firefly-iii-importer-1:8080
    internal: true
  - name: portainer
    hosts: [conteneurs.bruxelles.anneraud.fr]
    url: https://ix-portainer-portainer-1:8080
    internal: true
    insecure_backend: true
  - name: docmost
    hosts: [notes.anneraud.fr]
    url: http://docmost-docmost-1:3000
    internal: false
  - name: nextcloud
    hosts: [nuage.anneraud.fr]
    url: http://ix-nextcloud-nextcloud-1:80
    internal: false
    # Login form and two-factor challenge. Higher: the desktop client polls
    # /login/v2/poll every 3 s while its user logs in in the browser
    rate_limit:
      <<: *busy_login_rate_limit
      prefixes: [/login, /index.php/login]
    paths:
      - prefix: /.well-known/carddav
        redirect: /remote.php/dav
      - prefix: /.well-known/caldav
        redirect: /remote.php/dav
  - name: mealie
    hosts: [recettes.anneraud.fr]
    url: http://ix-mealie-mealie-1:8080
    internal: true
  - name: vaultwarden
    hosts: [bitwarden.anneraud.fr]
    url: http://ix-vaultwarden-vaultwarden-1:8080
    internal: false
    # Password and token requests (clients refresh their token about hourly),
    # and the admin page's login
    rate_limit:
      <<: *login_rate_limit
      prefixes: [/identity/connect/token, /identity/accounts/prelogin, /api/accounts/prelogin, /admin]
  - name: collabora
    hosts: [collabora.anneraud.fr]
    url: http://ix-collabora-collabora-1:8080
    internal: false
  - name: home-assistant
    hosts: [maison.anneraud.fr]
    url: http://ix-home-assistant-home-assistant-1:8080
    internal: false
    # Login flow steps; the apps renew their tokens on /auth/token
    rate_limit:
      <<: *login_rate_limit
      prefixes: [/auth/login_flow]
  - name: jellyfin
    hosts: [mediatheque.anneraud.fr]
    url: http://ix-jellyfin-jellyfin-1:8096
    internal: false
    # AuthenticateByName and AuthenticateWithQuickConnect
    rate_limit:
      <<: *login_rate_limit
      prefixes: [/Users/Authenticate]
  - name: radarr
    hosts: [radarr.anneraud.fr]
    url: http://ix-radarr-radarr-1:8080
    internal: true
  - name: sonarr
    hosts: [sonarr.anneraud.fr]
    url: http://ix-sonarr-sonarr-1:8080
    internal: true
  - name: router
    hosts: [berlin.anneraud.fr]
    url: http://192.168.0.1:80
    internal: true
  - name: camera-nicosie
    hosts: [nicosie.anneraud.fr]
    url: https://192.168.0.41:443
    internal: true
    insecure_backend: true
  - name: camera-skopje
    hosts: [skopje.anneraud.fr]
    url: https://192.168.0.43:443
    internal: true
    insecure_backend: true
  - name: camera-amsterdam
    hosts: [amsterdam.anneraud.fr]
    url: https://192.168.0.42:443
    internal: true
    insecure_backend: true
  - name: gitea
    hosts: [git.anneraud.fr]
    url: http://ix-gitea-gitea-1:30008
    internal: true
  - name: ddns-updater
    hosts: [ddns-updater.bruxelles.anneraud.fr]
    url: http://ix-ddns-updater-ddns-1:8080
    internal: true
  - name: umami
    hosts: [s.anneraud.fr, s.guenola-sahut.fr]
    url: http://ix-umami-umami-1:8080
    internal: false
  - name: prowlarr
    hosts: [prowlarr.anneraud.fr]
    url: http://ix-prowlarr-prowlarr-1:8080
    internal: true
  - name: seerr
    hosts: [jellyseerr.anneraud.fr]
    url: http://ix-seerr-seerr-1:8080
    internal: true
  - name: qbittorrent
    hosts: [telechargement.anneraud.fr]
    url: http://gluetun:30096
    internal: true
  - name: bazarr
    hosts: [bazarr.anneraud.fr]
    url: http://ix-bazarr-bazarr-1:8080
    internal: true
  - name: n8n
    hosts: [automatisation.anneraud.fr]
    url: http://ix-n8n-n8n-1:8080
    internal: true
  - name: wakapi
    hosts: [wakapi.anneraud.fr, wakapi.dera.page]
    url: http://wakapi-wakapi-1:3000
    internal: false
  - name: zitadel
    hosts: [authentification.anneraud.fr]
    # HTTP/2 end to end: Zitadel's gRPC API (used by its OpenTofu provider) needs it
    url: h2c://zitadel-zitadel-1:8080
    internal: false
    # Former login pages, still served
    rate_limit:
      <<: *login_rate_limit
      prefixes: [/ui/login]
    paths:
      - prefix: /ui/v2/login
        url: http://zitadel-login-1:3000
        # Every step of the login (name, password, second factor…) posts a
        # form here, a few per login
        rate_limit:
          <<: *busy_login_rate_limit
          prefixes: [/ui/v2/login]
  - name: synapse
    hosts: [matrix.anneraud.fr]
    url: http://matrix_anneraud-synapse-1:8008
    internal: false
    paths:
      - prefix: /_synapse/admin
        url: http://matrix_anneraud-synapse-1:8008
        internal: true
  # Matrix delegation for @…:anneraud.fr; the rest of anneraud.fr redirects to www.
  # Synapse's served well-known advertises anneraud.fr:443 (its server_name), so
  # other servers send federation requests to anneraud.fr/_matrix as well
  - name: matrix-delegation
    hosts: [anneraud.fr]
    prefix: /.well-known/matrix
    url: http://matrix_anneraud-synapse-1:8008
    internal: false
    paths:
      - prefix: /_matrix
        url: http://matrix_anneraud-synapse-1:8008
  - name: odoo-minitrainstore
    hosts: [www.minitrainstore.fr]
    url: http://ix-odoo-odoo-1:8069
    internal: false
    cloudflare_only: true
  - name: odoo-guenola-sahut
    hosts: [www.guenola-sahut.fr]
    url: http://ix-odoo-guenola-sahut-odoo-1:8069
    internal: false
    cloudflare_only: true
  - name: bentopdf
    hosts: [pdf.anneraud.fr]
    url: http://ix-bentopdf-bentopdf-1:8080
    internal: true   # no login of its own
  - name: metube
    hosts: [metube.anneraud.fr]
    url: http://ix-metube-metube-1:8080
    internal: true
  - name: databasus
    hosts: [databasus.anneraud.fr]
    url: http://ix-databasus-databasus-1:4005
    internal: true
  - name: bichon
    hosts: [archive-courriel.anneraud.fr]
    url: http://ix-bichon-bichon-1:8080
    internal: true
  - name: open-webui
    hosts: [assistant.anneraud.fr]
    url: http://ix-open-webui-open-webui-1:8080
    internal: true
  - name: searxng
    hosts: [recherche.anneraud.fr]
    url: http://ix-searxng-searxng-1:8080
    internal: true
  - name: meshcentral
    hosts: [parc.anneraud.fr]
    url: http://ix-meshcentral-meshcentral-1:443
    # Its agents and console are only reached from the LAN and the VPN
    internal: true
  - name: mcphub
    hosts: [mcphub.anneraud.fr]
    url: http://mcphub-mcphub-1:3000
    internal: true
  - name: semaphore
    hosts: [deploiement.anneraud.fr]
    url: http://deploiement-semaphore-1:3000
    internal: true
  - name: openbao
    hosts: [vault.xila.dev]
    url: https://vault_xila-openbao-1:8200
    internal: true
    insecure_backend: true

traefik_redirects:
  - name: anneraud
    hosts: [anneraud.fr]
    to: https://www.anneraud.fr
    preserve_path: false
  - name: minitrainstore
    hosts: [minitrainstore.fr]
    to: https://www.minitrainstore.fr
    preserve_path: false
    cloudflare_only: true
  - name: arnaud
    hosts: [arnaud.anneraud.fr]
    to: https://www.minitrainstore.fr
    preserve_path: true
  - name: guenola-sahut
    hosts: [guenola-sahut.fr]
    to: https://www.guenola-sahut.fr
    preserve_path: true
    cloudflare_only: true
