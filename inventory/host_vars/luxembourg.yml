---
# Cloud VM with a public IP
ansible_host: local.luxembourg.anneraud.fr
ansible_user: ansible
local_dns_host: local.luxembourg.anneraud.fr
global_dns_host: global.luxembourg.anneraud.fr

# Compose stacks live in /opt, behind Traefik
services_root: /opt

# Traefik instance
traefik_directory: traefik
traefik_dashboard_host: traefik.luxembourg.anneraud.fr
traefik_federation_publish: "8448:8448"

# Host and container metrics (services/metriques): Vigie runs here too and
# reaches the exporters inside the internal metriques Docker network
metriques_directory: metriques

# CrowdSec (services/protection)
protection_directory: protection

# Host firewall (hosts/luxembourg/firewall.yml): what may reach the host
# itself, on top of Oracle's security list. Ports Docker publishes skip the
# host's INPUT chain, so Oracle's list is what filters them; IPv6 clients of
# IPv4-only stacks are the exception, received by docker-proxy, a host
# process: every published port is listed here too
host_firewall_public_ports:
  - {port: 80, protocol: tcp, service: Traefik}
  - {port: 443, protocol: tcp, service: Traefik}
  - {port: 8448, protocol: tcp, service: Matrix federation (Traefik)}
  - {port: 3478, protocol: udp, service: NetBird STUN}
  - {port: 7881, protocol: tcp, service: LiveKit (services/appels)}
  - {port: 7882, protocol: udp, service: LiveKit (services/appels)}
  - {port: 3479, protocol: tcp, service: coturn (services/appels)}
  - {port: 3479, protocol: udp, service: coturn (services/appels)}
  - {port: 49160, last_port: 49200, protocol: udp, service: coturn relays (services/appels)}
# SSH only through the VPN; Oracle's serial console is the way in when
# NetBird is down
host_firewall_public_ssh: false
# Host services that containers reach through host.docker.internal
host_firewall_docker_networks: [172.16.0.0/12]
host_firewall_docker_ports:
  - {port: 9090, protocol: tcp, service: "Cockpit (Traefik, Gatus)"}
