---
# Host connection and DNS settings live in host_vars/<host>.yml
# (or in the folder host_vars/<host>/).
# Each service has a group naming the host it runs on: move a service by
# changing its group here.
all:
  children:
    serveurs:
      hosts:
        bruxelles:
        luxembourg:
        pristina:
    clients:
      hosts:
        paris:
    # Appliances whose users and sshd are managed in their own interface
    truenas:
      hosts:
        bruxelles:

    services:
      children:
        # Luxembourg
        cockpit:
          hosts:
            luxembourg:
        etat_anneraud:
          hosts:
            luxembourg:
        matrix_dera_page:
          hosts:
            luxembourg:
        star_history:
          hosts:
            luxembourg:
        status_dera_page:
          hosts:
            luxembourg:
        translate:
          hosts:
            luxembourg:
        vigie:
          hosts:
            luxembourg:
        vpn:
          hosts:
            luxembourg:

        # Bruxelles
        authentification:
          hosts:
            bruxelles:
        deploiement:
          hosts:
            bruxelles:
        linky:
          hosts:
            bruxelles:
        matrix_anneraud:
          hosts:
            bruxelles:
        mcphub:
          hosts:
            bruxelles:
        notes:
          hosts:
            bruxelles:
        nuage:
          hosts:
            bruxelles:
        secrets_xila:
          hosts:
            bruxelles:
        telechargement:
          hosts:
            bruxelles:
        wakapi:
          hosts:
            bruxelles:

        # Reverse proxy of each server
        proxy:
          hosts:
            bruxelles:
            luxembourg:
        # CrowdSec engine (services/protection); the Traefik of these hosts
        # checks every request against it (protection_enabled)
        protection:
          hosts:
            luxembourg:

        # Clients receiving Bruxelles snapshots
        replication:
          hosts:
            paris:
            pristina:
