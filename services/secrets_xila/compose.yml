# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  openbao:
    image: openbao/openbao:2.7.3
    logging: *logging
    user: "568:568"
    command: ["server", "-config=/openbao/config/config.hcl"]
    restart: unless-stopped
    environment:
      BAO_API_ADDR: ${BAO_API_ADDR:?Set BAO_API_ADDR}
      SKIP_CHOWN: "true"
    volumes:
      - ./data:/openbao/data
      - ./logs:/openbao/logs
      - ./config.hcl:/openbao/config/config.hcl:ro
      - ./tls:/openbao/tls:ro
    expose:
      - "8200"
    networks:
      - proxy
      - deverrouillage
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      - traefik.http.routers.openbao.rule=Host(`vault.xila.dev`)
      - traefik.http.routers.openbao.entrypoints=web-secure
      # The only xila.dev name on Bruxelles: this router requests the zone's wildcard
      - traefik.http.routers.openbao.tls=true
      - traefik.http.routers.openbao.tls.certresolver=letsencrypt
      - traefik.http.routers.openbao.tls.domains[0].main=xila.dev
      - traefik.http.routers.openbao.tls.domains[0].sans=*.xila.dev
      - traefik.http.routers.openbao.middlewares=internal-allowlist@file
      # OpenBao serves HTTPS itself, with a self-signed certificate
      - traefik.http.services.openbao.loadbalancer.server.scheme=https
      - traefik.http.services.openbao.loadbalancer.server.port=8200
      - traefik.http.services.openbao.loadbalancer.serverstransport=insecure-backend@file
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "bao status -tls-skip-verify -address=https://127.0.0.1:8200 >/dev/null 2>&1; status=$$?; test $$status -eq 0 -o $$status -eq 2"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Unseals OpenBao with the unseal keys that Bruxelles' TPM keeps sealed in
  # cles/, after each restart (deverrouillage/deverrouillage.sh). Seal the keys
  # once with: docker compose run --rm deverrouillage sceller
  deverrouillage:
    build: ./deverrouillage
    logging: *logging
    restart: unless-stopped
    # /dev/tpmrm0 belongs to root (mode 0600) and TrueNAS has no udev rule to
    # change that: root opens it as its owner, without any capability
    user: "0:0"
    devices:
      - /dev/tpmrm0
    environment:
      OPENBAO_NAME: vault.xila.dev
    volumes:
      - ./cles:/cles
      # Checks that it sends the keys to OpenBao
      - ./tls/public.pem:/openbao.pem:ro
    # Reaches OpenBao only: no route out of this network
    networks:
      - deverrouillage
    depends_on:
      - openbao
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1m

networks:
  proxy:
    name: "${PROXY_NETWORK}"
    external: true
  deverrouillage:
    internal: true
