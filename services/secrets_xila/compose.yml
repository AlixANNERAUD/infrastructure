# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  openbao:
    image: openbao/openbao:2.7.2
    logging: *logging
    user: "568:568"
    command: ["server", "-config=/openbao/config/config.hcl"]
    restart: unless-stopped
    environment:
      BAO_API_ADDR: ${BAO_API_ADDR:?Set BAO_API_ADDR}
      SKIP_CHOWN: "true"
    volumes:
      - ./data:/openbao/data
      - ./logs:/openbao/logs
      - ./config.hcl:/openbao/config/config.hcl:ro
      - ./tls:/openbao/tls:ro
    expose:
      - "8200"
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.openbao.rule=Host(`vault.xila.dev`)
      - traefik.http.routers.openbao.entrypoints=web-secure
      # The only xila.dev name on Bruxelles: this router requests the zone's wildcard
      - traefik.http.routers.openbao.tls=true
      - traefik.http.routers.openbao.tls.certresolver=letsencrypt
      - traefik.http.routers.openbao.tls.domains[0].main=xila.dev
      - traefik.http.routers.openbao.tls.domains[0].sans=*.xila.dev
      - traefik.http.routers.openbao.middlewares=internal-allowlist@file
      # OpenBao serves HTTPS itself, with a self-signed certificate
      - traefik.http.services.openbao.loadbalancer.server.scheme=https
      - traefik.http.services.openbao.loadbalancer.server.port=8200
      - traefik.http.services.openbao.loadbalancer.serverstransport=insecure-backend@file
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    healthcheck:
      test: ["CMD-SHELL", "bao status -tls-skip-verify -address=https://127.0.0.1:8200 >/dev/null 2>&1; status=$$?; test $$status -eq 0 -o $$status -eq 2"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

networks:
  proxy:
    external: true
