name: vigie

# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  victoriametrics:
    image: victoriametrics/victoria-metrics:v1.155.0
    logging: *logging
    restart: unless-stopped
    user: "${USER_ID}:${GROUP_ID}"
    mem_limit: 512m
    command:
      - "-retentionPeriod=3M"
      - "-promscrape.config=/etc/vigie/scrape.yml"
      - "-httpListenAddr=:8428"
      - "-storageDataPath=/victoria-metrics-data"
    volumes:
      - ./scrape.yml:/etc/vigie/scrape.yml:ro
      - ./victoriametrics:/victoria-metrics-data
    # The proxy network reaches Luxembourg's Traefik and, through the host,
    # Bruxelles' over Netbird; protection-metrics only reaches CrowdSec
    # (services/protection), metrics Luxembourg's exporters
    # (services/metriques). The port is never published
    networks:
      - vigie
      - proxy
      - protection-metrics
      - metrics

  # Traefik's access logs of both hosts, shipped by services/journaux (Vector):
  # on this host over the internal journaux network, from the others through
  # Traefik (the /insert/jsonline route below, behind the internal allowlist).
  # Grafana reads them through its VictoriaLogs data source; the port is never
  # published
  victorialogs:
    image: victoriametrics/victoria-logs:v1.53.0
    logging: *logging
    restart: unless-stopped
    user: "${USER_ID}:${GROUP_ID}"
    mem_limit: 256m
    command:
      - "-storageDataPath=/victoria-logs-data"
      - "-httpListenAddr=:9428"
      - "-retentionPeriod=${LOGS_RETENTION}"
      # Older days are dropped first once the logs reach this size
      - "-retention.maxDiskSpaceUsageBytes=${LOGS_MAX_DISK_SPACE}"
    volumes:
      - ./victorialogs:/victoria-logs-data
    networks:
      - vigie
      - proxy
      - logs
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      # Ingestion only: queries go through Grafana
      - traefik.http.routers.vigie-logs.rule=Host(`vigie.anneraud.fr`) && Path(`/insert/jsonline`) && Method(`POST`)
      - traefik.http.routers.vigie-logs.entrypoints=web-secure
      - traefik.http.routers.vigie-logs.tls=true
      - traefik.http.routers.vigie-logs.tls.certresolver=letsencrypt
      - traefik.http.routers.vigie-logs.middlewares=internal-allowlist@file
      - traefik.http.services.vigie-logs.loadbalancer.server.port=9428

  grafana:
    image: grafana/grafana:13.3.0
    logging: *logging
    restart: unless-stopped
    user: "${USER_ID}:${GROUP_ID}"
    # At 256m Grafana 13 stayed at its limit and restarted when a dashboard
    # loaded; plugin processes count against the same limit
    mem_limit: 768m
    environment:
      GF_SERVER_ROOT_URL: https://vigie.anneraud.fr/
      # No plugin downloads (Grafana installs some, such as jaeger, on its
      # first start): the VictoriaLogs data source plugin is downloaded and
      # checked by deploy.yml, into grafana/plugins
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # The break-glass admin login stays available next to Zitadel
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_AUTH_GENERIC_OAUTH_ENABLED: ${GRAFANA_OAUTH_ENABLED}
      GF_AUTH_GENERIC_OAUTH_NAME: Zitadel
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OAUTH_CLIENT_ID}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ""
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: "true"
      GF_AUTH_GENERIC_OAUTH_SCOPES: openid profile email urn:zitadel:iam:org:project:roles
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: https://authentification.anneraud.fr/oauth/v2/authorize
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: https://authentification.anneraud.fr/oauth/v2/token
      GF_AUTH_GENERIC_OAUTH_API_URL: https://authentification.anneraud.fr/oidc/v1/userinfo
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: >-
        contains(keys("urn:zitadel:iam:org:project:roles" || `{}`), 'vigie-admin') && 'Admin' || 'Viewer'
      # With Zitadel login, signing out also ends the Zitadel session (empty
      # without it, so the local admin signs out normally)
      GF_AUTH_SIGNOUT_REDIRECT_URL: ${GRAFANA_SIGNOUT_REDIRECT_URL}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
      - ./grafana/data:/var/lib/grafana
      - ./grafana/plugins:/var/lib/grafana/plugins:ro
    networks:
      - vigie
      - proxy
    depends_on:
      - victoriametrics
      - victorialogs
    labels:
      - traefik.enable=true
      - traefik.http.routers.vigie.rule=Host(`vigie.anneraud.fr`)
      - traefik.http.routers.vigie.entrypoints=web-secure
      - traefik.http.routers.vigie.tls=true
      - traefik.http.routers.vigie.tls.certresolver=letsencrypt
      - traefik.http.routers.vigie.middlewares=internal-allowlist@file
      - traefik.http.services.vigie.loadbalancer.server.port=3000

  # Grafana's official MCP server, read-only (no write tools), for MCPHub: it
  # queries Grafana with a Viewer service account's token, and answers only
  # requests carrying its own bearer token. Started only once both tokens are
  # in the vault (COMPOSE_PROFILES), never open without the second one
  mcp:
    image: grafana/mcp-grafana:2.1.1
    logging: *logging
    restart: unless-stopped
    profiles: [mcp]
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    command:
      - "--transport=streamable-http"
      - "--address=0.0.0.0:8000"
      - "--disable-write"
      # Only what Vigie has: Prometheus-type data source, dashboards, alert
      # rules, and the Loki tools, which also query VictoriaLogs data sources
      # (LogsQL) for Traefik's access logs (no OnCall, Tempo, incidents, image
      # rendering...)
      - "--enabled-tools=search,datasource,prometheus,loki,alerting,dashboard,folder,navigation,annotations"
      # Its DNS-rebinding protection only accepts loopback Host headers by
      # default; Traefik forwards the public name
      - "--allowed-hosts=vigie.anneraud.fr"
    environment:
      GRAFANA_URL: http://grafana:3000
      GRAFANA_SERVICE_ACCOUNT_TOKEN: ${GRAFANA_MCP_GRAFANA_TOKEN}
      MCP_GRAFANA_SERVER_TOKEN: ${GRAFANA_MCP_SERVER_TOKEN}
    networks:
      - vigie
      - proxy
    depends_on:
      - grafana
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      - traefik.http.routers.vigie-mcp.rule=Host(`vigie.anneraud.fr`) && PathPrefix(`/mcp`)
      - traefik.http.routers.vigie-mcp.entrypoints=web-secure
      - traefik.http.routers.vigie-mcp.tls=true
      - traefik.http.routers.vigie-mcp.tls.certresolver=letsencrypt
      - traefik.http.routers.vigie-mcp.middlewares=internal-allowlist@file
      - traefik.http.services.vigie-mcp.loadbalancer.server.port=8000

networks:
  # Grafana to VictoriaMetrics only: no route out of the Docker network
  vigie:
    internal: true
  proxy:
    name: "${PROXY_NETWORK}"
    external: true
  # Created by both playbooks; empty on a host without CrowdSec
  protection-metrics:
    name: protection-metrics
    external: true
  # VictoriaMetrics and the exporters of services/metriques only
  metrics:
    name: "${METRICS_NETWORK}"
    external: true
  # VictoriaLogs and this host's log shipper (services/journaux) only
  logs:
    name: "${LOGS_NETWORK}"
    external: true
