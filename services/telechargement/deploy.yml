---
- name: Deploy Téléchargement (qBittorrent, Prowlarr, Radarr, Sonarr, Bazarr, Seerr)
  hosts: telechargement
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/telechargement/vault.yml
    - ../../vault/cloudflare/vault.yml
  roles:
    - role: compose_service
      vars:
        compose_service_name: telechargement
        compose_service_proxy: true
        compose_service_directory: qBittorrent
        compose_service_user: 568
        compose_service_group: 3010
        # Shared with Jellyfin (a TrueNAS App), also created by services/proxy
        compose_service_external_networks:
          - name: liaison-telechargement
            internal: true
        compose_service_environment:
          VPN_USER_NAME: "{{ vpn_user_name }}"
          VPN_PASSWORD: "{{ vpn_password }}"
          VPN_SERVICE_PROVIDER: "{{ vpn_service_provider }}"
          VPN_TYPE: "{{ vpn_type }}"
          SERVER_COUNTRIES: "{{ vpn_server_countries }}"
          DOWNLOADS_PATH: /mnt/Donnees/Mediatheque/torrents
          # Each app keeps the configuration folder its TrueNAS App had
          APPLICATIONS_PATH: "{{ services_root }}"
          BAZARR_CONFIGURATION_PATH: /mnt/Donnees/Applications/Bazarr
          MEDIATHEQUE_PATH: /mnt/Donnees/Mediatheque
        compose_service_dns_records:
          - record: telechargement.anneraud.fr
            visibility: private
