---
# MeshCentral's login through Zitadel: the authStrategies entry of its default
# domain in config.json. In: parc_client_id, parc_client_secret.
# Out: parc_authentication_strategy.
- name: Build MeshCentral's authentication strategy
  ansible.builtin.set_fact:
    parc_authentication_strategy:
      authStrategies:
        oidc:
          issuer: https://authentification.anneraud.fr
          # openid-client sends the secret with HTTP Basic (client_secret)
          client:
            client_id: "{{ parc_client_id }}"
            client_secret: "{{ parc_client_secret }}"
            redirect_uri: https://parc.anneraud.fr/auth-oidc-callback
            post_logout_redirect_uri: https://parc.anneraud.fr/login
          # MeshCentral never links a Zitadel login to an existing account: its
          # first login creates one (user//~oidc:<Zitadel id>). Without this,
          # nobody could log in through Zitadel; the new account sees no device
          # until the admin shares a device group with it
          newAccounts: true
          # Nor can it create device groups of its own
          newAccountsRights: [nonewgroups]
  no_log: true   # holds the client secret
