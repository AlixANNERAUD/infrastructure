---
# Portainer (conteneurs.bruxelles.anneraud.fr) is a TrueNAS app. Its Zitadel
# login is set in Portainer's administration, not by this repository. This
# playbook provisions the Zitadel application and gives what to enter. Run it
# with mise.
- name: Prepare Portainer's Zitadel login
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../vault/authentification/vault.yml
  vars:
    # The client secret: written to a file, never printed (Semaphore keeps its
    # logs); the same file services/authentification/applications.yml writes
    conteneurs_secret_file: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/infrastructure/zitadel/portainer.secret"
  roles:
    - role: zitadel
  tasks:
    - name: Check that Portainer's Zitadel application is provisioned
      ansible.builtin.assert:
        that:
          - zitadel_provisioned
          - zitadel_client_ids.portainer | default('') | length > 0
          - zitadel_client_secrets.portainer | default('') | length > 0
        fail_msg: Zitadel is not provisioned (see the messages above) or has no portainer application with a secret.
        quiet: true

    - name: Build the login settings
      ansible.builtin.include_tasks: tasks/login_settings.yml
      vars:
        conteneurs_client_id: "{{ zitadel_client_ids.portainer }}"

    - name: Create the folder of the client secret
      ansible.builtin.file:
        path: "{{ conteneurs_secret_file | dirname }}"
        state: directory
        mode: "0700"

    - name: Write the client secret
      ansible.builtin.copy:
        dest: "{{ conteneurs_secret_file }}"
        content: "{{ zitadel_client_secrets.portainer }}"
        mode: "0600"
      no_log: true

    - name: Say where to enter the settings
      ansible.builtin.debug:
        msg: >-
          In Portainer, as an administrator: Settings → Authentication, with the fields below; leave the others
          (Logout URL, team membership) empty, then Save settings. The initial admin keeps logging in with its
          password ("Use internal authentication"); rename the other accounts to their email first (see readme.md).

    - name: Say what to enter in Portainer
      ansible.builtin.debug:
        msg: >-
          {{ item.name }}: {{ ('the content of ' ~ conteneurs_secret_file ~ ' (the client secret); copy it with: wl-copy < '
          ~ conteneurs_secret_file ~ ' (Wayland), xclip -selection clipboard < … (X11) or pbcopy < … (macOS)')
          if item.secret | default(false) else item.value }}
      loop: "{{ conteneurs_login_fields }}"
      loop_control:
        label: "{{ item.name }}"
