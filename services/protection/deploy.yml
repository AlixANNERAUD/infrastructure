---
# CrowdSec security engine. Deploy services/proxy/deploy.yml first: it turns
# the bouncer on in this host's Traefik and writes the access log read here.
# A host with metriques_host (Bruxelles) serves the engine's metrics to Vigie
# through its Traefik, behind the internal allowlist; on Vigie's host,
# VictoriaMetrics reads them over the internal protection-metrics network.
- name: Deploy CrowdSec
  hosts: protection
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/protection/vault.yml
    - ../../vault/cloudflare/vault.yml
  vars:
    protection_allowlist: internal
    protection_allowlist_description: Networks of the internal-allowlist middleware and Docker's private range
  roles:
    - role: compose_service
      vars:
        compose_service_name: protection
        compose_service_directory: "{{ protection_directory }}"
        compose_service_directories:
          - config
          - data
        compose_service_files:
          - source: acquisition.yaml
            destination: config/acquis.d/traefik.yaml
        compose_service_templates:
          - source: trusted_hosts.yaml.j2
            destination: config/postoverflows/s01-whitelist/trusted-hosts.yaml
        compose_service_environment:
          BOUNCER_KEY: "{{ protection_bouncer_key }}"
          METRICS_ROUTED: "{{ (metriques_host is defined) | string | lower }}"
          METRICS_HOST: "{{ metriques_host | default('') }}"
        compose_service_external_networks:
          - name: protection
            internal: true
          - name: protection-metrics
            internal: true

  tasks:
    # The engine installs the hub collections before its local API answers
    - name: Allow the LAN, the VPN and Docker's range
      community.docker.docker_container_exec:
        container: crowdsec
        argv: "{{ ['sh', '-s', '--', protection_allowlist, protection_allowlist_description] + protection_trusted_networks }}"
        stdin: "{{ lookup('ansible.builtin.file', 'allowlist.sh') }}"
      register: protection_allowlist_result
      until: protection_allowlist_result.rc == 0
      retries: 18
      delay: 10
      changed_when: "'changed' in protection_allowlist_result.stdout_lines"

    # Optional: only with an enrollment key from https://app.crowdsec.net in the
    # vault. Enrolling again is harmless: an enrolled engine is left as it is
    - name: Enroll the engine in the CrowdSec console
      community.docker.docker_container_exec:
        container: crowdsec
        argv: [cscli, console, enroll, --name, "{{ inventory_hostname }}", "{{ protection_enrollment_key }}"]
      register: protection_enrollment
      failed_when: protection_enrollment.rc != 0
      changed_when: "'successfully enrolled' in protection_enrollment.stdout ~ protection_enrollment.stderr"
      no_log: true
      when: protection_enrollment_key | default('') | length > 0
      notify: Explain how to finish the enrollment

  handlers:
    - name: Explain how to finish the enrollment
      ansible.builtin.debug:
        msg: Accept the engine at https://app.crowdsec.net, then restart it (docker restart crowdsec).
