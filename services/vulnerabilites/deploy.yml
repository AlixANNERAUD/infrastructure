---
# nanobom for Alix's personal projects, apart from Xila's (services/vulnerabilities)
# so that each has its own accounts and projects.
# nanobom: SBOM vulnerability tracker. CI pipelines upload their SBOMs to it
# (nanobom-action) and it checks them against OSV every night. Its database
# is PostgreSQL, so backups dump it like the other stacks. Create the first
# administrator once deployed:
#   docker exec vulnerabilites /app/nanobom create-administrator --username <name>
- name: Deploy nanobom (personal projects)
  hosts: vulnerabilites
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/vulnerabilites/vault.yml
    - ../../vault/cloudflare/vault.yml
  vars:
    vulnerabilites_host: vulnerabilites.anneraud.fr
  pre_tasks:
    # It goes into nanobom's database URL as it is
    - name: Check the database password
      ansible.builtin.assert:
        that:
          - vulnerabilites_database_password | default('') is match('^[A-Za-z0-9._~-]{32,}$')
        fail_msg: >-
          vault/vulnerabilites/vault.yml needs vulnerabilites_database_password, at least 32 characters
          among letters, digits and -._~ (openssl rand -hex 32).
        quiet: true

  roles:
    - role: compose_service
      vars:
        compose_service_name: vulnerabilites
        compose_service_proxy: true
        compose_service_directories:
          - path: postgres   # Postgres (Alpine) runs as 70 and refuses a folder others can read
            owner: "70"
            group: "70"
            mode: "0700"
        compose_service_environment:
          HOST: "{{ vulnerabilites_host }}"
          DATABASE_PASSWORD: "{{ vulnerabilites_database_password }}"
        compose_service_dns_records:
          - record: "{{ vulnerabilites_host }}"
