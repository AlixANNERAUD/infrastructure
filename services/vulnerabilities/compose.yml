# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  nanobom:
    image: ghcr.io/alixanneraud/nanobom:0.1.2
    logging: *logging
    container_name: vulnerabilities
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    # nanobom migrates the database at startup
    depends_on:
      database:
        condition: service_healthy
    environment:
      NANOBOM_DATABASE_URL: postgres://nanobom:${DATABASE_PASSWORD}@database:5432/nanobom?sslmode=disable
      # Links, cookies, sign-in redirects and the cross-site check use it
      NANOBOM_PUBLIC_URL: https://${HOST}
      # Every project checked again each night (UTC), and after each upload
      NANOBOM_SCHEDULE: "0 3 * * *"
      NANOBOM_LOG_FORMAT: json
      # Only Traefik reaches it: client addresses come from its headers, for
      # the sign-in rate limit
      NANOBOM_TRUST_FORWARDED_HEADERS: "true"
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      - traefik.http.routers.vulnerabilities.rule=Host(`${HOST}`)
      - traefik.http.routers.vulnerabilities.entrypoints=web-secure
      - traefik.http.routers.vulnerabilities.tls=true
      - traefik.http.routers.vulnerabilities.tls.certresolver=letsencrypt
      - traefik.http.routers.vulnerabilities.service=vulnerabilities
      - traefik.http.services.vulnerabilities.loadbalancer.server.port=8080

      # Password sign-ins (POST /auth/login) get their own router, rate
      # limited per client address: a burst of 10, then one every 6 s (as the
      # Bruxelles logins, inventory/host_vars/bruxelles/traefik.yml)
      - traefik.http.routers.vulnerabilities-login.rule=Host(`${HOST}`) && Method(`POST`) && Path(`/auth/login`)
      - traefik.http.routers.vulnerabilities-login.entrypoints=web-secure
      - traefik.http.routers.vulnerabilities-login.tls=true
      - traefik.http.routers.vulnerabilities-login.service=vulnerabilities
      - traefik.http.routers.vulnerabilities-login.middlewares=vulnerabilities-login-rate-limit
      - traefik.http.middlewares.vulnerabilities-login-rate-limit.ratelimit.average=10
      - traefik.http.middlewares.vulnerabilities-login-rate-limit.ratelimit.period=1m
      - traefik.http.middlewares.vulnerabilities-login-rate-limit.ratelimit.burst=10
      - traefik.http.middlewares.vulnerabilities-login-rate-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64

      # The metrics need no authentication: internal only
      - traefik.http.routers.vulnerabilities-metrics.rule=Host(`${HOST}`) && Path(`/metrics`)
      - traefik.http.routers.vulnerabilities-metrics.entrypoints=web-secure
      - traefik.http.routers.vulnerabilities-metrics.tls=true
      - traefik.http.routers.vulnerabilities-metrics.service=vulnerabilities
      - traefik.http.routers.vulnerabilities-metrics.middlewares=internal-allowlist@file

  database:
    image: postgres:18.6-alpine
    logging: *logging
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: nanobom
      POSTGRES_USER: nanobom
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ./postgres:/var/lib/postgresql
    networks:
      - internal
    healthcheck:
      test: ["CMD", "pg_isready", "--username", "nanobom", "--dbname", "nanobom"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  # Database side only: no route out of the Docker network
  internal:
    internal: true
  traefik:
    external: true
