# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  wakapi:
    image: ghcr.io/muety/wakapi:2.18
    logging: *logging
    init: true
    restart: unless-stopped
    environment:
      # See README.md and config.default.yml for all config options
      WAKAPI_DB_TYPE: "postgres"
      WAKAPI_DB_NAME: "wakapi"
      WAKAPI_DB_USER: ${DATABASE_USER}
      WAKAPI_DB_HOST: "database"
      WAKAPI_DB_PORT: "5432"
      WAKAPI_DB_PASSWORD: ${DATABASE_PASSWORD}
      WAKAPI_PASSWORD_SALT: ${WAKAPI_PASSWORD_SALT}
      WAKAPI_ALLOW_SIGNUP: "false"
      WAKAPI_TRUST_REVERSE_PROXY_IPS: ${WAKAPI_TRUST_REVERSE_PROXY_IPS}
      WAKAPI_PUBLIC_URL: ${WAKAPI_PUBLIC_URL}
      WAKAPI_MAIL_ENABLED: "true"
      WAKAPI_MAIL_SENDER: wakapi@dera.page
      WAKAPI_MAIL_PROVIDER: smtp
      WAKAPI_MAIL_SMTP_HOST: ${WAKAPI_MAIL_SMTP_HOST}
      WAKAPI_MAIL_SMTP_USER: ${WAKAPI_MAIL_SMTP_USER}
      WAKAPI_MAIL_SMTP_PASS: ${WAKAPI_MAIL_SMTP_PASS}
      WAKAPI_MAIL_SMTP_TLS: "false"
      WAKAPI_MAIL_SMTP_PORT: "587"
      # Zitadel login (services/wakapi/tasks/oidc_environment.yml; all empty
      # without a client). The local login stays, as the fallback.
      # Wakapi finds a Zitadel login's account by its subject only, never by
      # email: no account for logins that are not linked yet (readme, Wakapi)
      WAKAPI_OIDC_ALLOW_SIGNUP: "false"
      WAKAPI_OIDC_PROVIDERS_0_NAME: ${OIDC_NAME}
      WAKAPI_OIDC_PROVIDERS_0_DISPLAY_NAME: ${OIDC_DISPLAY_NAME}
      WAKAPI_OIDC_PROVIDERS_0_ENDPOINT: ${OIDC_ENDPOINT}
      WAKAPI_OIDC_PROVIDERS_0_CLIENT_ID: ${OIDC_CLIENT_ID}
      WAKAPI_OIDC_PROVIDERS_0_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=proxy
      - traefik.http.routers.wakapi.rule=Host(`wakapi.anneraud.fr`) || Host(`wakapi.dera.page`)
      - traefik.http.routers.wakapi.entrypoints=web-secure
      # The only dera.page name on Bruxelles: this router requests the zone's
      # wildcard (*.anneraud.fr comes from the file routes)
      - traefik.http.routers.wakapi.tls=true
      - traefik.http.routers.wakapi.tls.certresolver=letsencrypt
      - traefik.http.routers.wakapi.tls.domains[0].main=dera.page
      - traefik.http.routers.wakapi.tls.domains[0].sans=*.dera.page
      - traefik.http.services.wakapi.loadbalancer.server.port=3000

      # Wakapi's OpenID Connect callback is on its public URL (wakapi.dera.page):
      # a Zitadel login started on wakapi.anneraud.fr would not find its state
      # there, so it starts on wakapi.dera.page. The rule is longer than the
      # main router's, so it takes precedence
      # yamllint disable-line rule:line-length
      - traefik.http.routers.wakapi-oidc.rule=Host(`wakapi.anneraud.fr`) && PathPrefix(`/oidc/zitadel/`)
      - traefik.http.routers.wakapi-oidc.entrypoints=web-secure
      - traefik.http.routers.wakapi-oidc.tls=true
      - traefik.http.routers.wakapi-oidc.service=wakapi
      - traefik.http.routers.wakapi-oidc.middlewares=wakapi-oidc-redirection
      - traefik.http.middlewares.wakapi-oidc-redirection.redirectregex.regex=^https://wakapi\.anneraud\.fr(:[0-9]+)?/(.*)
      - traefik.http.middlewares.wakapi-oidc-redirection.redirectregex.replacement=https://wakapi.dera.page/$$2

  database:
    image: postgres:18.6
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: "wakapi"
    volumes:
      - ./Postgres_data:/var/lib/postgresql
    networks:
      - internal
      - databases

networks:
  # Database side only: no route out of the Docker network
  internal:
    internal: true
  # Shared with Databasus, which backs the databases up; created by the
  # compose_service role (compose_service_external_networks)
  databases:
    external: true
  proxy:
    external: true
