---
# Semaphore's project, described in OpenTofu next to this playbook: keys,
# repository, inventory, a run and a preview template per playbook, and the
# nightly preview. Runs from the owner's computer with mise, over the VPN
# (Semaphore is behind the internal allowlist), after deploy.yml:
#   mise deploy services/deploiement/configuration.yml
# Run it again when playbooks are added or removed.

# The private key Semaphore connects to the hosts with, generated by deploy.yml
- name: Read Semaphore's SSH key
  hosts: deploiement
  become: true
  gather_facts: false
  vars_files:
    - ../../vault/ansible/vault.yml
  tasks:
    - name: Read the private key Semaphore connects with
      ansible.builtin.slurp:
        path: "{{ services_root }}/Deploiement/keys/ansible"
      register: deploiement_ssh_key
      no_log: true

- name: Configure Semaphore's project
  hosts: localhost
  gather_facts: false
  vars_files:
    - ../../vault/deploiement/vault.yml
  vars:
    deploiement_url: https://deploiement.anneraud.fr
    deploiement_state_path: "{{ playbook_dir }}/../../vault/deploiement/opentofu.tfstate"
  tasks:
    - name: Check the vault values
      ansible.builtin.assert:
        that:
          - deploiement_admin_login | default('') | length > 0
          - deploiement_admin_password | default('') | length > 0
          - deploiement_state_passphrase | default('') | length >= 16
        fail_msg: >-
          vault/deploiement/vault.yml needs deploiement_admin_login and deploiement_admin_password (Semaphore's
          local administrator, whose password may have been changed in its interface since) and
          deploiement_state_passphrase (openssl rand -base64 32), the passphrase of this configuration's state
        quiet: true

    # The laptop reaches Semaphore through NetBird only (internal allowlist)
    - name: Check that Semaphore answers
      ansible.builtin.uri:
        url: "{{ deploiement_url }}/api/ping"
        timeout: 10
        return_content: true
      register: deploiement_ping
      failed_when: false

    - name: Fail when Semaphore does not answer
      ansible.builtin.fail:
        msg: "{{ deploiement_url }} does not answer ({{ deploiement_ping.msg | default('') }}): is the VPN connected?"
      when: deploiement_ping.status | default(0) != 200

    # OpenTofu acts as the local administrator, with a token made for this run
    # and expired at the end of it
    - name: Log in as Semaphore's local administrator
      ansible.builtin.uri:
        url: "{{ deploiement_url }}/api/auth/login"
        method: POST
        body_format: json
        body:
          auth: "{{ deploiement_admin_login }}"
          password: "{{ deploiement_admin_password }}"
        status_code: 204
      register: deploiement_login
      no_log: true

    - name: Create an API token for OpenTofu
      ansible.builtin.uri:
        url: "{{ deploiement_url }}/api/user/tokens"
        method: POST
        headers:
          Cookie: "{{ deploiement_login.cookies_string }}"
        body_format: json
        body:
          name: OpenTofu
        status_code: 201
      register: deploiement_token
      no_log: true

    - name: Apply Semaphore's configuration
      block:
        - name: Apply the OpenTofu configuration
          ansible.builtin.include_role:
            name: opentofu
          vars:
            opentofu_project_path: "{{ playbook_dir }}"
            opentofu_state_path: "{{ deploiement_state_path }}"
            opentofu_variables:
              semaphore_url: "{{ deploiement_url }}"
            opentofu_secret_variables:
              semaphore_token: "{{ deploiement_token.json.id }}"
              ssh_private_key: "{{ hostvars[groups['deploiement'][0]].deploiement_ssh_key.content | b64decode }}"
              # The vault password the playbooks run with here, from the system keyring
              vault_password: "{{ lookup('ansible.builtin.pipe', lookup('ansible.builtin.env', 'ANSIBLE_VAULT_PASSWORD_FILE')) }}"
              state_passphrase: "{{ deploiement_state_passphrase }}"

      always:
        - name: Expire the API token
          ansible.builtin.uri:
            url: "{{ deploiement_url }}/api/user/tokens/{{ deploiement_token.json.id }}"
            method: DELETE
            headers:
              Authorization: "Bearer {{ deploiement_token.json.id }}"
            status_code: [200, 204]
          no_log: true
