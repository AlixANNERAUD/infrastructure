# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  semaphore:
    image: semaphoreui/semaphore:v2.19.17
    logging: *logging
    restart: unless-stopped
    user: ${USER_ID}:${GROUP_ID}
    environment:
      SEMAPHORE_DB_DIALECT: sqlite
      SEMAPHORE_ADMIN: ${SEMAPHORE_ADMIN}
      SEMAPHORE_ADMIN_NAME: ${SEMAPHORE_ADMIN_NAME}
      SEMAPHORE_ADMIN_EMAIL: ${SEMAPHORE_ADMIN_EMAIL}
      SEMAPHORE_ADMIN_PASSWORD: ${SEMAPHORE_ADMIN_PASSWORD}
      SEMAPHORE_ACCESS_KEY_ENCRYPTION: ${SEMAPHORE_ACCESS_KEY_ENCRYPTION}
      SEMAPHORE_WEB_ROOT: ${SEMAPHORE_WEB_ROOT}
      # Login through Zitadel next to the local accounts; {} without a client
      SEMAPHORE_OIDC_PROVIDERS: ${SEMAPHORE_OIDC_PROVIDERS}
    volumes:
      - ./data:/var/lib/semaphore
      - ./config:/etc/semaphore
      - ./gitconfig:/etc/gitconfig:ro
      - ./git-credentials:/etc/git-credentials:ro
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      - traefik.http.routers.semaphore.rule=Host(`deploiement.anneraud.fr`)
      - traefik.http.routers.semaphore.entrypoints=web-secure
      - traefik.http.routers.semaphore.tls=true
      - traefik.http.routers.semaphore.middlewares=internal-allowlist@file
      - traefik.http.services.semaphore.loadbalancer.server.port=3000

networks:
  proxy:
    name: "${PROXY_NETWORK}"
    external: true
