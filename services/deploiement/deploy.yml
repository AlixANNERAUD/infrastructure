---
- name: Deploy Semaphore
  hosts: deploiement
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/deploiement/vault.yml
    - ../../vault/cloudflare/vault.yml
  vars:
    # The role's own variables (compose_service_*) are not visible to this
    # play's tasks: what both need is set here
    deploiement_path: "{{ services_root }}/Deploiement"
    # UID of the semaphore user in the official image
    deploiement_user: 1001
  pre_tasks:
    # Without the Zitadel credentials (or tofu, in Semaphore's own runs) the
    # client of the previous deploy is kept, or Semaphore has its local login only
    - name: Get Semaphore's Zitadel login
      ansible.builtin.include_role:
        name: zitadel
        tasks_from: login
      vars:
        zitadel_login_application: deploiement
        zitadel_login_environment_file: "{{ deploiement_path }}/.env"
        zitadel_login_client_id_variable: OIDC_CLIENT_ID
        zitadel_login_client_secret_variable: OIDC_CLIENT_SECRET

    - name: Build Semaphore's OIDC providers
      ansible.builtin.include_tasks: tasks/oidc_providers.yml
      vars:
        deploiement_oidc_client_id: "{{ zitadel_login_client_id }}"
        deploiement_oidc_client_secret: "{{ zitadel_login_client_secret }}"

  roles:
    - role: compose_service
      vars:
        compose_service_name: deploiement
        compose_service_directory: Deploiement
        compose_service_user: "{{ deploiement_user }}"
        compose_service_directories:
          - data
          - config
          - keys
        # Git configuration of the container, written below: it must exist when the stack starts
        compose_service_mounted_files:
          - gitconfig
          - git-credentials
        compose_service_environment:
          SEMAPHORE_ADMIN: "{{ deploiement_admin_login }}"
          SEMAPHORE_ADMIN_NAME: "{{ deploiement_admin_name }}"
          SEMAPHORE_ADMIN_EMAIL: "{{ deploiement_admin_email }}"
          SEMAPHORE_ADMIN_PASSWORD: "{{ deploiement_admin_password }}"
          SEMAPHORE_ACCESS_KEY_ENCRYPTION: "{{ deploiement_access_key_encryption }}"
          SEMAPHORE_WEB_ROOT: https://deploiement.anneraud.fr
          # Kept separately so a failed provisioning can reuse them (zitadel role, login)
          OIDC_CLIENT_ID: "{{ zitadel_login_client_id }}"
          OIDC_CLIENT_SECRET: "{{ zitadel_login_client_secret }}"
          SEMAPHORE_OIDC_PROVIDERS: "{{ deploiement_oidc_providers }}"
        compose_service_dns_records:
          - record: deploiement.anneraud.fr
            visibility: private
  tasks:
    # The vault submodule is private: git hands the token over, through a
    # credential helper (not in a URL, so it stays out of logs), for that
    # repository only
    - name: Configure git credentials in the container
      ansible.builtin.copy:
        dest: "{{ deploiement_path }}/gitconfig"
        content: |
          [credential]
            useHttpPath = true

          [credential "https://github.com/AlixANNERAUD/Infrastructure_vault.git"]
            helper = store --file=/etc/git-credentials
        mode: "0600"
        owner: "{{ deploiement_user }}"
        group: "{{ deploiement_user }}"
      notify: Restart the stack

    - name: Store the token of the vault repository
      ansible.builtin.copy:
        dest: "{{ deploiement_path }}/git-credentials"
        content: >-
          {{ ('https://x-access-token:' ~ deploiement_vault_repository_token ~ '@github.com/AlixANNERAUD/Infrastructure_vault.git' ~ '\n')
             if deploiement_vault_repository_token | default('') | length > 0 else '' }}
        mode: "0600"
        owner: "{{ deploiement_user }}"
        group: "{{ deploiement_user }}"
      no_log: true
      notify: Restart the stack

    - name: Explain how to let Semaphore clone the vault repository
      ansible.builtin.debug:
        msg:
          - "deploiement_vault_repository_token is missing from vault/deploiement/vault.yml: Semaphore can't clone the private vault submodule."
          - "Create a fine-grained GitHub token (Contents: read-only, only on AlixANNERAUD/Infrastructure_vault, with an expiry),"
          - "add it to the vault as deploiement_vault_repository_token, then run this playbook again."
          - "Steps: https://www.anneraud.fr/documentation/deploiement#semaphore-mise-en-place"
      when: deploiement_vault_repository_token | default('') | length == 0

    # Semaphore connects to the hosts with this key: it is created once, then
    # pasted in Semaphore's key store by hand
    - name: Generate the SSH key Semaphore connects with
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -t
          - ed25519
          - -N
          - ""
          - -C
          - semaphore
          - -f
          - "{{ deploiement_path }}/keys/ansible"
        creates: "{{ deploiement_path }}/keys/ansible"

    - name: Restrict the SSH key to the Semaphore user
      ansible.builtin.file:
        path: "{{ deploiement_path }}/keys/{{ item.name }}"
        owner: "{{ deploiement_user }}"
        group: "{{ deploiement_user }}"
        mode: "{{ item.mode }}"
      loop:
        - name: ansible
          mode: "0600"
        - name: ansible.pub
          mode: "0644"
      loop_control:
        label: "{{ item.name }}"

    - name: Read the public key of Semaphore
      ansible.builtin.slurp:
        src: "{{ deploiement_path }}/keys/ansible.pub"
      register: deploiement_public_key

    - name: Explain how to authorize Semaphore on the hosts
      ansible.builtin.debug:
        msg:
          - "Semaphore's public key: {{ (deploiement_public_key.content | b64decode).strip() }}"
          - "1. Add it to automation_additional_public_keys in inventory/group_vars/all.yml, then run: mise deploy hosts/bootstrap.yml"
          - "2. TrueNAS: add it as a line of Credentials > Users > {{ automation_user }} > Authorized Keys (bootstrap prints the exact lines)."
          - "   Those lines include the current subnet of the proxy network: redo this step if that network is ever recreated."
          - "3. In Semaphore, store the private key {{ deploiement_path }}/keys/ansible as an SSH key with the user {{ automation_user }}."
          - "The full one-time setup of the project: https://www.anneraud.fr/documentation/deploiement#semaphore-mise-en-place"
