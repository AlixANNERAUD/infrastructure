---
- name: Deploy Traefik
  hosts: proxy
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/protection/vault.yml
    - ../../vault/cloudflare/vault.yml
  pre_tasks:
    - name: Check that no other container holds ports 80 and 443
      ansible.builtin.include_tasks: check_published_ports.yml

    # The bouncer reads its key when Traefik loads the crowdsec middleware, so
    # the key must be there before Traefik starts with it
    - name: Create the folder of the CrowdSec bouncer key
      ansible.builtin.file:
        path: "{{ services_root }}/{{ traefik_directory }}/protection"
        state: directory
        mode: "0750"
      when: protection_enabled | bool

    - name: Write the CrowdSec bouncer key
      ansible.builtin.copy:
        content: "{{ protection_bouncer_key }}"
        dest: "{{ services_root }}/{{ traefik_directory }}/protection/bouncer_key"
        mode: "0600"
      no_log: true
      when: protection_enabled | bool

    - name: Look up the proxy network
      community.docker.docker_network_info:
        name: "{{ proxy_network }}"
      register: traefik_proxy_network

    # Never recreate an existing network: a driver mismatch would make the module disconnect every container
    - name: Create the proxy network
      community.docker.docker_network:
        name: "{{ proxy_network }}"
      when: not traefik_proxy_network.exists

  roles:
    - role: compose_service
      vars:
        compose_service_name: proxy
        compose_service_directory: "{{ traefik_directory }}"
        compose_service_directories:
          - dynamic
          - protection
        compose_service_files:
          - source: policy.yml
            destination: dynamic/policy.yml
            restart: false   # Traefik reloads the dynamic folder itself
        # The crowdsec middleware, only where the entrypoint uses it
        compose_service_templates: >-
          {{ [{'source': 'protection.yml.j2', 'destination': 'dynamic/protection.yml', 'restart': false}]
             if protection_enabled | bool else [] }}
        compose_service_external_networks:
          - name: protection
            internal: true
        compose_service_environment:
          CLOUDFLARE_EMAIL: "{{ cloudflare_email }}"
          CLOUDFLARE_API_KEY: "{{ cloudflare_api_key }}"
          PROXY_NETWORK: "{{ proxy_network }}"
          TRAEFIK_DASHBOARD_HOST: "{{ traefik_dashboard_host }}"
          TRAEFIK_FEDERATION_PUBLISH: "{{ traefik_federation_publish }}"
          TRAEFIK_TRUSTED_PROXIES: "{{ cloudflare_networks | join(',') }}"
          # Banned clients are refused before any other middleware runs
          TRAEFIK_ENTRYPOINT_MIDDLEWARES: "{{ 'crowdsec@file,security-headers@file' if protection_enabled | bool else 'security-headers@file' }}"
        compose_service_dns_records:
          - record: "{{ traefik_dashboard_host }}"
            visibility: private

  tasks:
    # On a host that left the protection group, once Traefik no longer uses them
    - name: Remove the CrowdSec middleware and bouncer key
      ansible.builtin.file:
        path: "{{ services_root }}/{{ traefik_directory }}/{{ item }}"
        state: absent
      loop:
        - dynamic/protection.yml
        - protection/bouncer_key
      when: not protection_enabled | bool

    # Traefik watches the dynamic folder, so the routes apply without a restart
    - name: Render the routes
      ansible.builtin.template:
        src: routes.yml.j2
        dest: "{{ services_root }}/{{ traefik_directory }}/dynamic/routes.yml"
        mode: "0640"
      when: traefik_routes is defined

    # Docker publishes ports past the host firewall, and TrueNAS manages its
    # apps and its UI in its own interface: list what is still exposed instead
    - name: List the ports published by containers
      ansible.builtin.command:
        argv: [docker, ps, --format, "{{ '{{.Names}} {{.Ports}}' }}"]
      register: traefik_published_ports
      changed_when: false
      when: inventory_hostname in groups['truenas']

    # The output also holds the UI's private key: never print it
    - name: Read the TrueNAS UI settings
      ansible.builtin.command: midclt call system.general.config
      register: traefik_truenas_settings
      changed_when: false
      no_log: true
      when: inventory_hostname in groups['truenas']

    - name: Check the addresses the TrueNAS UI listens on
      ansible.builtin.set_fact:
        traefik_exposure_steps: >-
          {{
            ['TrueNAS UI listens on all addresses: in System → General → GUI, listen on 192.168.0.21 only (not 0.0.0.0 or ::)']
            if '0.0.0.0' in traefik_ui_addresses or '::' in traefik_ui_addresses else []
          }}
      vars:
        traefik_ui_settings: "{{ traefik_truenas_settings.stdout | from_json }}"
        traefik_ui_addresses: "{{ traefik_ui_settings.ui_address + traefik_ui_settings.ui_v6address }}"
      no_log: true
      when: inventory_hostname in groups['truenas']

    - name: Check the ports containers publish on all addresses
      ansible.builtin.set_fact:
        traefik_exposure_steps: >-
          {{
            traefik_exposure_steps
            + ([('Container ' ~ traefik_container ~ ' publishes ports ' ~ traefik_exposed_ports | join(', ') ~ ' on all addresses: ')
                ~ ('it is the unused gacha:latest container, remove it (docker rm -f exciting_thompson)'
                   if traefik_container == 'exciting_thompson'
                   else 'unpublish them in its app settings, or remove it if unused')]
               if traefik_exposed_ports else [])
          }}
      vars:
        # Only these publications on every address are expected
        traefik_allowed_ports:
          traefik: ["80", "443"]
          gluetun: ["6881"]
        traefik_container: "{{ item.split()[0] }}"
        traefik_exposed_ports: >-
          {{ item | regex_findall('(?:0[.]0[.]0[.]0|\[::\]):([0-9-]+)->') | unique
             | reject('in', traefik_allowed_ports[traefik_container] | default([])) | list }}
      loop: "{{ traefik_published_ports.stdout_lines | default([]) }}"
      loop_control:
        label: "{{ traefik_container }}"
      when: inventory_hostname in groups['truenas']

    - name: List what is still exposed
      ansible.builtin.debug:
        msg: "{{ ['Manual steps for ' ~ inventory_hostname ~ ', then run this playbook again:'] + traefik_exposure_steps }}"
      when: inventory_hostname in groups['truenas'] and traefik_exposure_steps | length > 0

    - name: Confirm that only Traefik and gluetun are exposed
      ansible.builtin.debug:
        msg: "{{ inventory_hostname }}: only Traefik's 80/443 and gluetun's 6881 are published."
      when: inventory_hostname in groups['truenas'] and traefik_exposure_steps | length == 0
