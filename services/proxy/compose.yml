# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  traefik:
    image: "traefik:v3.7.16"
    logging: *logging
    container_name: "traefik"
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    security_opt:
      - no-new-privileges:true
    networks:
      - proxy
      - protection   # reaches CrowdSec's local API (services/protection)
    environment:
      - TZ=Europe/Paris
      - CLOUDFLARE_EMAIL=${CLOUDFLARE_EMAIL}
      - CLOUDFLARE_API_KEY=${CLOUDFLARE_API_KEY}
    command:
      - "--api.insecure=false"
      - "--api.dashboard=true"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=${PROXY_NETWORK}"
      - "--providers.file.directory=/etc/traefik/dynamic"

      - "--entryPoints.web.address=:80"
      - "--entryPoints.web.http.redirections.entryPoint.to=web-secure"
      - "--entryPoints.web.http.redirections.entryPoint.scheme=https"
      - "--entryPoints.web.http.redirections.entryPoint.permanent=true"

      - "--entryPoints.web-secure.address=:443"
      - "--entryPoints.web-secure.http.tls=true"
      # Applies to label and file routes alike: security-headers@file, preceded
      # by CrowdSec's bouncer (crowdsec@file) on hosts of the protection group
      - "--entryPoints.web-secure.http.middlewares=${TRAEFIK_ENTRYPOINT_MIDDLEWARES}"
      # Clients must not smuggle underscore aliases (X_Forwarded_For) of the headers Traefik sets; nginx dropped them
      - "--entryPoints.web-secure.http.aliasHeadersStrategy=delete"
      # Netbird's gRPC streams last as long as a peer is connected, so requests
      # must not be cut after the default 60s; idle connections still close
      # after the default 180s
      - "--entryPoints.web-secure.transport.respondingTimeouts.readTimeout=0"

      # Cloudflare's forwarded headers are kept so backends see the visitor's address; the internal allowlist
      # still checks the connection's address, so trusting them does not widen it
      - "--entryPoints.web-secure.forwardedHeaders.trustedIPs=${TRAEFIK_TRUSTED_PROXIES}"

      - "--entryPoints.web-secure-federation.address=:8448"
      - "--entryPoints.web-secure-federation.http.tls=true"

      # Scraped from inside the Docker network (never published): reaching the
      # metrics through the public name would hairpin via Docker with a 172.x
      # source that the internal allowlist rejects
      - "--entryPoints.metrics.address=:8082"

      # Let's Encrypt configuration
      - "--certificatesresolvers.letsencrypt.acme.email=alix@anneraud.fr" # replace with your actual email
      - "--certificatesresolvers.letsencrypt.acme.storage=/letsencrypt/acme.json"
      # - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--certificatesresolvers.letsencrypt.acme.dnsChallenge.provider=cloudflare"
      - "--certificatesresolvers.letsencrypt.acme.dnsChallenge.delayBeforeCheck=10"

      # Metrics are routed manually, behind the internal allowlist
      - "--metrics.prometheus=true"
      - "--metrics.prometheus.manualRouting=true"
      - "--metrics.prometheus.addRoutersLabels=true"

      # Access log in JSON on the container's output, so Docker's log rotation
      # applies; CrowdSec (services/protection) reads it through the Docker API.
      # Its Traefik parser reads the user agent from the request_User-Agent field
      - "--accessLog=true"
      - "--accessLog.format=json"
      - "--accessLog.fields.headers.names.User-Agent=keep"

      # CrowdSec bouncer (crowdsec@file middleware, services/proxy/protection.yml.j2),
      # downloaded from plugins.traefik.io when Traefik starts; Dependabot does not
      # update it: https://github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin/releases
      - "--experimental.plugins.crowdsec-bouncer.moduleName=github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin"
      - "--experimental.plugins.crowdsec-bouncer.version=v1.8.1"
    ports:
      - "80:80"
      - "443:443"
      - "${TRAEFIK_FEDERATION_PUBLISH}"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./dynamic:/etc/traefik/dynamic:ro"
      - "./letsencrypt:/letsencrypt"
      - "./protection:/etc/traefik/protection:ro"   # CrowdSec bouncer key
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.dashboard.rule=Host(`${TRAEFIK_DASHBOARD_HOST}`)"
      - "traefik.http.routers.dashboard.entrypoints=web-secure"
      - "traefik.http.routers.dashboard.service=api@internal"
      - "traefik.http.routers.dashboard.tls=true"
      - "traefik.http.routers.dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.routers.dashboard.middlewares=internal-allowlist@file"

      - "traefik.http.routers.metrics.rule=Host(`${TRAEFIK_DASHBOARD_HOST}`) && PathPrefix(`/metrics`)"
      - "traefik.http.routers.metrics.entrypoints=web-secure"
      - "traefik.http.routers.metrics.service=prometheus@internal"
      - "traefik.http.routers.metrics.tls=true"
      - "traefik.http.routers.metrics.middlewares=internal-allowlist@file"

      # Plain HTTP without allowlist: the port is only reachable from the Docker network
      - "traefik.http.routers.metrics-internal.rule=PathPrefix(`/metrics`)"
      - "traefik.http.routers.metrics-internal.entrypoints=metrics"
      - "traefik.http.routers.metrics-internal.service=prometheus@internal"

networks:
  proxy:
    name: "${PROXY_NETWORK}"
    external: true
  # Traefik and CrowdSec only, created by both playbooks; empty on hosts
  # without CrowdSec
  protection:
    name: protection
    external: true
