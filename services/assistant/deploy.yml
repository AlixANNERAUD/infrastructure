---
# Hermes Agent: personal AI assistant, driven from its dashboard (LAN and VPN
# only), from Matrix and from T3 Code (ACP), with MCPHub's tools. Models,
# Matrix and MCPHub are set up once deployed, inside the container:
#   docker exec -it assistant hermes auth add openai-codex   # ChatGPT subscription
#   docker exec -it assistant hermes config edit             # mcp_servers: MCPHub
# Provider keys and Matrix credentials go in assistant_environment, in the vault.
- name: Deploy Hermes Agent
  hosts: assistant
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/assistant/vault.yml
    - ../../vault/cloudflare/vault.yml
  vars:
    assistant_host: assistant.anneraud.fr
    assistant_dashboard_username: alix
    # No account on the host has it; Hermes only needs its data writable
    assistant_user: 2000
    # API keys, tokens, Matrix IDs and URLs: Compose would interpret $ and quotes in .env
    assistant_value_pattern: '^[A-Za-z0-9._~:/+=@!,-]*$'
  pre_tasks:
    # Compose reads them from .env, where $ and quotes would be interpreted
    - name: Check the dashboard's login and the extra variables
      ansible.builtin.assert:
        that:
          - assistant_dashboard_password | default('') is match('^[A-Za-z0-9._~-]{20,}$')
          - assistant_dashboard_secret | default('') is match('^[A-Za-z0-9._~-]{32,}$')
          - assistant_environment | default({}) is mapping
          - assistant_environment | default({}) | dict2items | rejectattr('key', 'match', '^[A-Z][A-Z0-9_]*$') | list | length == 0
          - assistant_environment | default({}) | dict2items | map(attribute='value') | map('string')
            | reject('match', assistant_value_pattern) | list | length == 0
        fail_msg: >-
          vault/assistant/vault.yml needs assistant_dashboard_password (at least 20 characters) and
          assistant_dashboard_secret (at least 32, openssl rand -hex 32), both made of letters, digits
          and -._~, and assistant_environment, when set, maps upper-case variable names to values made
          of letters, digits and ._~:/+=@!,-
        quiet: true

    # Traefik reaches the dashboard from this network: the dashboard takes the
    # client's address and scheme from its forwarded headers only there
    - name: Look up the proxy network
      community.docker.docker_network_info:
        name: "{{ proxy_network }}"
      register: assistant_proxy_network
      failed_when: not assistant_proxy_network.exists   # created by services/proxy

    - name: Trust Traefik's forwarded headers from the proxy network
      ansible.builtin.set_fact:
        assistant_trusted_proxies: "{{ assistant_proxy_network.network.IPAM.Config | map(attribute='Subnet') | list }}"

  roles:
    - role: compose_service
      vars:
        compose_service_name: assistant
        compose_service_user: "{{ assistant_user }}"
        compose_service_directories:
          - path: data   # its credentials, memory and sessions: no one else reads them
            owner: "{{ assistant_user }}"
            group: "{{ assistant_user }}"
            mode: "0700"
        compose_service_environment: >-
          {{ {
            'HOST': assistant_host,
            'PROXY_NETWORK': proxy_network,
            'HERMES_DASHBOARD_BASIC_AUTH_USERNAME': assistant_dashboard_username,
            'HERMES_DASHBOARD_BASIC_AUTH_PASSWORD': assistant_dashboard_password,
            'HERMES_DASHBOARD_BASIC_AUTH_SECRET': assistant_dashboard_secret,
          } | combine(assistant_environment | default({})) }}
        compose_service_dns_records:
          - record: "{{ assistant_host }}"
            visibility: private

  post_tasks:
    # dashboard.trusted_proxies has no environment variable: it lives in
    # Hermes' config.yaml, next to the settings made from the dashboard
    - name: Read the proxies the dashboard trusts
      community.docker.docker_container_exec:
        container: assistant
        argv: [hermes, config, get, dashboard.trusted_proxies]
      register: assistant_current_proxies
      changed_when: false
      # Just (re)started: its setup may not be done yet
      retries: 12
      delay: 10
      until: assistant_current_proxies.rc == 0

    - name: Trust the proxy network in the dashboard
      community.docker.docker_container_exec:
        container: assistant
        argv: [hermes, config, set, dashboard.trusted_proxies, "{{ assistant_trusted_proxies | to_json }}"]
      when: assistant_trusted_proxies | reject('in', assistant_current_proxies.stdout) | list | length > 0
      notify: Restart Hermes

  handlers:
    - name: Restart Hermes
      community.docker.docker_compose_v2:
        project_src: "{{ services_root }}/assistant"
        state: restarted
