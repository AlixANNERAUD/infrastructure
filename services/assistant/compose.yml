# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  # Hermes Agent runs commands and reads the web on its own, so a page or a
  # message can try to steer it (prompt injection). Its image starts as root
  # under s6-overlay to own its data folder, then runs the gateway and the
  # dashboard as USER_ID: it keeps only the capabilities that takes. One
  # stack per person (NAME), each with its own folder, user and address
  hermes:
    image: nousresearch/hermes-agent:v0.23.1
    container_name: ${NAME}
    logging: *logging
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add:
      - CHOWN          # data folder handed to USER_ID
      - DAC_OVERRIDE
      - FOWNER
      - SETUID         # s6-setuidgid drops each service to USER_ID
      - SETGID
      - KILL           # s6 signals the services it supervises
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 512
    # Provider and channel credentials (Matrix), and the dashboard's login,
    # written by the playbook (not required for CI's docker compose config,
    # which has no .env)
    env_file:
      - path: .env
        required: false
    environment:
      HERMES_UID: ${USER_ID}
      HERMES_GID: ${GROUP_ID}
      # The web dashboard, next to the gateway: behind Traefik, it requires
      # the username and password from .env (no login, no start)
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_PUBLIC_URL: https://${HOST}
      TZ: Europe/Paris
    command: ["gateway", "run"]
    # /api/status answers without a login
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9119/api/status', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 2m
      retries: 3
    volumes:
      # Configuration, credentials, memory, skills and sessions
      - ./data:/opt/data
    # Through Traefik only, and out to the model providers, Matrix and MCPHub
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      - traefik.http.routers.${NAME}.rule=Host(`${HOST}`)
      - traefik.http.routers.${NAME}.entrypoints=web-secure
      - traefik.http.routers.${NAME}.tls=true
      - traefik.http.routers.${NAME}.tls.certresolver=letsencrypt
      # The dashboard drives the agent: LAN and VPN only
      - traefik.http.routers.${NAME}.middlewares=internal-allowlist@file
      - traefik.http.services.${NAME}.loadbalancer.server.port=9119

networks:
  proxy:
    name: "${PROXY_NETWORK}"
    external: true
