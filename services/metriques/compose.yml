name: metriques

# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

# Exporters scraped by Vigie (services/vigie), never published: on the host
# running Vigie they sit in the internal metriques network with
# VictoriaMetrics; elsewhere (Bruxelles) in the proxy network, routed by
# Traefik behind the internal allowlist (METRICS_ROUTED). Vector ships
# Traefik's access log the other way, to Vigie's VictoriaLogs: through the
# same metriques network next to Vigie, through Luxembourg's Traefik elsewhere
services:
  # Host CPU, memory, load, filesystems, ZFS ARC and pool states, read from
  # the host's /proc and mounts (pid host, root filesystem read-only)
  node-exporter:
    image: prom/node-exporter:v1.12.1
    logging: *logging
    restart: unless-stopped
    mem_limit: 128m
    pid: host
    read_only: true
    # Root without privileges, except reading through folders that only their
    # owner may enter (service folders, datasets mounted below them)
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt:
      - no-new-privileges:true
    command:
      - "--path.rootfs=/host"
      # The container's own network namespace, not the host's
      - "--no-collector.arp"
      - "--no-collector.netclass"
      - "--no-collector.netdev"
      - "--no-collector.netstat"
      - "--no-collector.sockstat"
      # *.prom files other services write about themselves (the backup's
      # result, services/sauvegarde), in this service's textfile folder
      - "--collector.textfile.directory=/host${METRICS_TEXTFILE_DIRECTORY}"
    volumes:
      - /:/host:ro,rslave
    networks:
      - metrics
    labels:
      - traefik.enable=${METRICS_ROUTED}
      - traefik.docker.network=${METRICS_NETWORK}
      - traefik.http.routers.metriques-node.rule=Host(`${METRICS_HOST}`) && PathPrefix(`/node`)
      - traefik.http.routers.metriques-node.entrypoints=web-secure
      - traefik.http.routers.metriques-node.tls=true
      - traefik.http.routers.metriques-node.middlewares=internal-allowlist@file,metriques-node-path
      # Only the metrics: every path below /node serves them
      - traefik.http.middlewares.metriques-node-path.replacepath.path=/metrics
      - traefik.http.services.metriques-node.loadbalancer.server.port=9100

  # CPU, memory, network and disk I/O of every container, labelled with its
  # Compose project (the app: TrueNAS Apps are ix-<app> projects), and the
  # host's own network traffic (its root container, id /, read from
  # /rootfs/proc/1/net/dev: node_exporter only sees its own network namespace)
  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    logging: *logging
    restart: unless-stopped
    mem_limit: 512m
    read_only: true
    security_opt:
      - no-new-privileges:true
    command:
      - "--docker_only=true"
      - "--enable_metrics=cpu,memory,network,diskIO"
      - "--housekeeping_interval=30s"
      - "--store_container_labels=false"
      - "--whitelisted_container_labels=com.docker.compose.project,com.docker.compose.service"
    # As cAdvisor's documentation, without privileges: the Docker socket (in
    # /var/run) for container names and labels, cgroups in /sys, and the
    # Docker root folder through /rootfs
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
    networks:
      - metrics
    labels:
      - traefik.enable=${METRICS_ROUTED}
      - traefik.docker.network=${METRICS_NETWORK}
      - traefik.http.routers.metriques-containers.rule=Host(`${METRICS_HOST}`) && PathPrefix(`/containers`)
      - traefik.http.routers.metriques-containers.entrypoints=web-secure
      - traefik.http.routers.metriques-containers.tls=true
      - traefik.http.routers.metriques-containers.middlewares=internal-allowlist@file,metriques-containers-path
      # Only the metrics, not cAdvisor's web interface
      - traefik.http.middlewares.metriques-containers-path.replacepath.path=/metrics
      - traefik.http.services.metriques-containers.loadbalancer.server.port=8080

  # Traefik's access log (its container output, also read by CrowdSec) to
  # VictoriaLogs, as vector.yaml (rendered by deploy.yml) sends it. Root
  # without any capability, as it reads the root-owned vector.yaml
  vector:
    image: timberio/vector:0.60.0-distroless-static
    logging: *logging
    restart: unless-stopped
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
    # Its data folder; nothing in it needs to outlive the container
    tmpfs:
      - /var/lib/vector
    networks:
      - docker
      - metrics
    depends_on:
      - socket-proxy

  # Read-only view of the Docker API for Vector's docker_logs source: listing
  # containers, following their events and reading their logs, nothing else
  # (no POST, no exec)
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    logging: *logging
    restart: unless-stopped
    mem_limit: 64m
    environment:
      CONTAINERS: 1
      EVENTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker

networks:
  metrics:
    name: "${METRICS_NETWORK}"
    external: true
  # Vector to the socket proxy: no route out of the Docker network
  docker:
    internal: true
