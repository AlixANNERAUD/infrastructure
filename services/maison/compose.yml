# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  # Reached through Traefik on its own proxy network, and on the LAN through
  # its macvlan address for discovery (mDNS, SSDP). Its HTTP settings (port,
  # trusted proxy) and recorder are in Configuration/packages/infrastructure.yaml,
  # rendered by the playbook
  home-assistant:
    image: ghcr.io/home-assistant/home-assistant:2026.11.1
    logging: *logging
    restart: unless-stopped
    # Its s6 init runs as root: only what it needs to own its files and
    # discover devices (raw sockets for ping and DHCP watching)
    cap_drop: [ALL]
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - NET_BIND_SERVICE
      - NET_RAW
    security_opt:
      - no-new-privileges:true
    environment:
      TZ: Europe/Paris
    volumes:
      - ./Configuration:/config
      - ./Media:/media
      - ${CAMERAS_PATH}:/media/cameras
    healthcheck:
      test: ["CMD", "wget", "--quiet", "-O", "/dev/null", "http://127.0.0.1:8080/manifest.json"]
      interval: 30s
      timeout: 5s
      start_period: 2m
      retries: 5
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - proxy
      - internal
      - default   # HA-Linky, and the way out
      - lan
    # Logins (POST to the login flow, case-insensitive) get their own router,
    # which only adds a rate limit per client address (an IPv6 client counts as
    # its /64); the apps renew their tokens on /auth/token, not limited. The
    # limits come from inventory/host_vars/bruxelles/traefik.yml
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      - traefik.http.routers.home-assistant.rule=Host(`maison.anneraud.fr`)
      - traefik.http.routers.home-assistant.entrypoints=web-secure
      - traefik.http.routers.home-assistant.tls=true
      - traefik.http.routers.home-assistant.service=home-assistant
      - traefik.http.services.home-assistant.loadbalancer.server.port=8080
      - traefik.http.routers.home-assistant-login.rule=(Host(`maison.anneraud.fr`)) && Method(`POST`) && (PathRegexp(`(?i)^/auth/login_flow`))
      - traefik.http.routers.home-assistant-login.entrypoints=web-secure
      - traefik.http.routers.home-assistant-login.tls=true
      - traefik.http.routers.home-assistant-login.service=home-assistant
      - traefik.http.routers.home-assistant-login.middlewares=home-assistant-login-rate-limit
      - traefik.http.middlewares.home-assistant-login-rate-limit.ratelimit.average=${TRAEFIK_LOGIN_RATE_LIMIT_AVERAGE:?}
      - traefik.http.middlewares.home-assistant-login-rate-limit.ratelimit.period=${TRAEFIK_LOGIN_RATE_LIMIT_PERIOD:?}
      - traefik.http.middlewares.home-assistant-login-rate-limit.ratelimit.burst=${TRAEFIK_LOGIN_RATE_LIMIT_BURST:?}
      - traefik.http.middlewares.home-assistant-login-rate-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64

  # History and long-term statistics (the recorder), reached as postgres
  postgres:
    image: postgres:18.6-trixie
    logging: *logging
    restart: unless-stopped
    user: "999:999"   # owner of Postgres_data
    environment:
      POSTGRES_USER: home-assistant
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: home-assistant
      TZ: Europe/Paris
    volumes:
      - ./Postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "home-assistant", "-d", "home-assistant"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - internal
      - databases   # backed up by Databasus

  # Linky meter readings from Enedis, written to Home Assistant's statistics
  # over its websocket, inside the stack
  ha-linky:
    image: ghcr.io/alixanneraud/ha-linky-standalone:latest@sha256:7035e0385337577b4124ed708abc0594ee73b252d50c82f182791d21cb351ed7
    logging: *logging
    restart: unless-stopped
    volumes:
      - ./Linky/options.json:/data/options.json:ro
    environment:
      TZ: Europe/Paris
      WS_URL: ws://home-assistant:8080/api/websocket
      SUPERVISOR_TOKEN: ${HOME_ASSISTANT_TOKEN}
    depends_on:
      - home-assistant
    networks:
      - default

networks:
  # Home Assistant to its database only: no route out of the Docker network
  internal:
    internal: true
  # Shared with Databasus, which backs the databases up; created by the
  # compose_service role (compose_service_external_networks)
  databases:
    external: true
  proxy:
    name: "${PROXY_NETWORK}"
    external: true
  # The LAN, created by the playbook (inventory/host_vars/bruxelles/maison.yml)
  lan:
    name: "${MACVLAN_NETWORK}"
    external: true
