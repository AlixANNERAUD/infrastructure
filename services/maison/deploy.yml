---
# Home: Home Assistant, its PostgreSQL (history and statistics) and HA-Linky
# (Linky meter readings from Enedis), in one stack. Home Assistant is routed
# by Traefik and also has its own LAN address (macvlan) for device discovery.
# The configuration folder is Home Assistant's own, except
# Configuration/packages/infrastructure.yaml (the recorder and the Zitadel
# login), rendered here, and the OpenID Connect integration, installed here.
# Its HTTP settings are set in its UI: Settings > System > Network, with the
# subnet of proxy-maison as trusted proxy. Home Assistant's own login stays
# available next to Zitadel's, as a fallback
- name: Deploy Maison (Home Assistant)
  hosts: maison
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/maison/vault.yml
    - ../../vault/cloudflare/vault.yml
  vars:
    maison_configuration: "{{ services_root }}/Home_assistant/Configuration"
    # OpenID Connect integration, installed or replaced when its version
    # differs; not followed by Dependabot, the checksum is the one GitHub lists
    # for the release asset: https://github.com/christiaangoossens/hass-oidc-auth/releases
    maison_oidc_version: 1.2.1
    maison_oidc_checksum: sha256:e5badaaacaa63cfd6fe733924a05e76d75058836190398598fb24de57cd47ccd
    # Links a first Zitadel login to the Home Assistant account whose username
    # is the Zitadel login name (alix@anneraud.fr). Only for one deploy, with
    # -e maison_oidc_link_users=true: anyone with that login name gets the
    # account, its rights included, and its multi-factor login is skipped
    maison_oidc_link_users: false
  pre_tasks:
    # Written to .env and into the recorder's URL: no character to escape there
    - name: Check the vault values
      ansible.builtin.assert:
        that:
          - maison_database_password | default('') is match('^[A-Za-z0-9._~-]{16,}$')
          - home_assistant_supervisor_token | default('') | length > 0
          - ha_linky_meters | default([]) is sequence
        fail_msg: >-
          vault/maison/vault.yml needs maison_database_password (the existing database's, at least 16
          letters, digits or -._~), home_assistant_supervisor_token (HA-Linky's long-lived token),
          ha_linky_meters and ha_linky_costs
        quiet: true

    - name: Look up the LAN network
      community.docker.docker_network_info:
        name: "{{ maison_macvlan.name }}"
      register: maison_lan_network

    # Never recreate an existing network: the module would disconnect Home Assistant
    - name: Create the LAN network
      community.docker.docker_network:
        name: "{{ maison_macvlan.name }}"
        driver: macvlan
        driver_options:
          parent: "{{ maison_macvlan.parent }}"
        ipam_config:
          - subnet: "{{ maison_macvlan.subnet }}"
            gateway: "{{ maison_macvlan.gateway }}"
            iprange: "{{ maison_macvlan.address }}"
      when: not maison_lan_network.exists

    # Without the Zitadel credentials the client id is empty: the integration
    # stays off and Home Assistant keeps only its own login
    - name: Get Home Assistant's Zitadel login
      ansible.builtin.include_role:
        name: zitadel
        tasks_from: login
      vars:
        zitadel_login_application: maison
        zitadel_login_environment_file: "{{ services_root }}/Home_assistant/.env"
        zitadel_login_client_id_variable: OIDC_CLIENT_ID

  roles:
    - role: compose_service
      vars:
        compose_service_name: maison
        compose_service_proxy: true
        compose_service_directory: Home_assistant   # the former TrueNAS App's dataset, kept with its data
        compose_service_directories:
          - path: Postgres_data   # Postgres runs as 999 and refuses a folder others can read
            owner: "999"
            group: "999"
            mode: "0700"
          - path: Linky
            mode: "0750"
        compose_service_templates:
          - source: infrastructure.yaml.j2
            destination: Configuration/packages/infrastructure.yaml
          - source: ha_linky_options.json.j2
            destination: Linky/options.json
        compose_service_external_networks:
          - name: databases   # shared with Databasus
            internal: true
        compose_service_environment:
          DATABASE_PASSWORD: "{{ maison_database_password }}"
          HOME_ASSISTANT_TOKEN: "{{ home_assistant_supervisor_token }}"
          MACVLAN_NETWORK: "{{ maison_macvlan.name }}"
          CAMERAS_PATH: /mnt/Donnees/Cameras
          TRAEFIK_LOGIN_RATE_LIMIT_AVERAGE: "{{ traefik_login_rate_limit.average }}"
          TRAEFIK_LOGIN_RATE_LIMIT_PERIOD: "{{ traefik_login_rate_limit.period }}"
          TRAEFIK_LOGIN_RATE_LIMIT_BURST: "{{ traefik_login_rate_limit.burst }}"
          # Kept for the next deploy, in case Zitadel provisioning fails then
          OIDC_CLIENT_ID: "{{ zitadel_login_client_id }}"

  post_tasks:
    - name: Read the installed OpenID Connect integration
      ansible.builtin.slurp:
        path: "{{ maison_configuration }}/custom_components/auth_oidc/manifest.json"
      register: maison_oidc_manifest
      failed_when: false

    - name: Install the OpenID Connect integration
      # e30= is an empty JSON object, for a missing manifest
      when: (maison_oidc_manifest.content | default('e30=') | b64decode | from_json).version | default('') != maison_oidc_version
      block:
        - name: Create the custom integrations folder
          ansible.builtin.file:
            path: "{{ maison_configuration }}/custom_components"
            state: directory
            mode: "0755"

        - name: Download the OpenID Connect integration
          ansible.builtin.get_url:
            url: "https://github.com/christiaangoossens/hass-oidc-auth/releases/download/v{{ maison_oidc_version }}/hass-oidc-auth.zip"
            dest: "{{ maison_configuration }}/custom_components/auth_oidc.zip"
            checksum: "{{ maison_oidc_checksum }}"
            mode: "0640"

        # A new version replaces the whole folder: no file of the previous one is left
        - name: Remove the previous version
          ansible.builtin.file:
            path: "{{ maison_configuration }}/custom_components/auth_oidc"
            state: absent

        # The release's files sit at the archive's root; the host's Python
        # extracts it, as TrueNAS may lack unzip
        - name: Extract the OpenID Connect integration
          ansible.builtin.command:
            argv:
              - python3
              - -m
              - zipfile
              - -e
              - "{{ maison_configuration }}/custom_components/auth_oidc.zip"
              - "{{ maison_configuration }}/custom_components/auth_oidc"
            creates: "{{ maison_configuration }}/custom_components/auth_oidc/manifest.json"

        - name: Remove the archive
          ansible.builtin.file:
            path: "{{ maison_configuration }}/custom_components/auth_oidc.zip"
            state: absent

        # Integrations load at startup only
        - name: Restart Home Assistant with the integration
          community.docker.docker_compose_v2:
            project_src: "{{ services_root }}/Home_assistant"
            services: [home-assistant]
            state: restarted
