name: journaux

# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

# Ships Traefik's access log to Vigie's VictoriaLogs (services/vigie): on the
# host running Vigie over the internal journaux network, elsewhere (Bruxelles)
# through Luxembourg's Traefik, behind its internal allowlist. Nothing is
# published or routed here
services:
  vector:
    image: timberio/vector:0.60.0-distroless-static
    logging: *logging
    restart: unless-stopped
    user: "${USER_ID}:${GROUP_ID}"
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      LOGS_HOST: ${LOGS_HOST}
      LOGS_URL: ${LOGS_URL}
    volumes:
      - ./vector.yaml:/etc/vector/vector.yaml:ro
    # Its data folder; nothing in it needs to outlive the container
    tmpfs:
      - /var/lib/vector
    networks:
      - docker
      - logs
    depends_on:
      - socket-proxy

  # Read-only view of the Docker API for Vector's docker_logs source: listing
  # containers, following their events and reading their logs, nothing else
  # (no POST, no exec)
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    logging: *logging
    restart: unless-stopped
    mem_limit: 64m
    environment:
      CONTAINERS: 1
      EVENTS: 1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - docker

networks:
  # Vector to the socket proxy: no route out of the Docker network
  docker:
    internal: true
  # Where VictoriaLogs is reached: the internal journaux network next to
  # Vigie, the proxy network (with a route out) elsewhere
  logs:
    name: "${LOGS_NETWORK}"
    external: true
