---
- name: Deploy Tolgee
  hosts: translate
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/translate/vault.yml
    - ../../vault/cloudflare/vault.yml
  pre_tasks:
    # Without the Zitadel credentials the client id is empty: Tolgee shows no
    # Zitadel button and keeps only its local login
    - name: Get Tolgee's Zitadel login
      ansible.builtin.include_role:
        name: zitadel
        tasks_from: login
      vars:
        zitadel_login_application: translate
        zitadel_login_environment_file: "{{ services_root }}/tolgee_anneraud/.env"
        zitadel_login_client_id_variable: OIDC_CLIENT_ID
        zitadel_login_client_secret_variable: OIDC_CLIENT_SECRET

  roles:
    - role: compose_service
      vars:
        compose_service_name: translate
        compose_service_directory: tolgee_anneraud   # previous name, kept so containers and volumes stay the same
        compose_service_environment:
          DATABASE_NAME: tolgee
          DATABASE_USER: "{{ database_user }}"
          DATABASE_PASSWORD: "{{ database_password }}"
          TOLGEE_AUTHENTICATION_JWT_SECRET: "{{ tolgee_authentication_jwt_secret }}"
          TOLGEE_SMTP_HOST: "{{ tolgee_smtp_host }}"
          TOLGEE_SMTP_PASSWORD: "{{ tolgee_smtp_password }}"
          TOLGEE_SMTP_USERNAME: "{{ tolgee_smtp_username }}"
          OIDC_CLIENT_ID: "{{ zitadel_login_client_id }}"
          OIDC_CLIENT_SECRET: "{{ zitadel_login_client_secret }}"
        compose_service_dns_records:
          - record: translate.anneraud.fr
          - record: translate.xila.dev
