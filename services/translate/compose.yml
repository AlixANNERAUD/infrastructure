# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  app:
    image: tolgee/tolgee:v3.241.3
    logging: *logging
    restart: unless-stopped
    volumes:
      - ./tolgee_data:/data
    environment:
      - TOLGEE_AUTHENTICATION_ENABLED=true
      - TOLGEE_AUTHENTICATION_JWT_SECRET=${TOLGEE_AUTHENTICATION_JWT_SECRET}

      - TOLGEE_SMTP_AUTH=true
      - TOLGEE_SMTP_FROM=Translate <translate@anneraud.fr>
      - TOLGEE_SMTP_HOST=${TOLGEE_SMTP_HOST}
      - TOLGEE_SMTP_PASSWORD=${TOLGEE_SMTP_PASSWORD}
      - TOLGEE_SMTP_PORT=2525
      - TOLGEE_SMTP_SSL_ENABLED=true
      - TOLGEE_SMTP_USERNAME=${TOLGEE_SMTP_USERNAME}

      - TOLGEE_SPRING_DATASOURCE_URL=jdbc:postgresql://database:5432/${DATABASE_NAME}
      - TOLGEE_SPRING_DATASOURCE_USERNAME=${DATABASE_USER}
      - TOLGEE_SPRING_DATASOURCE_PASSWORD=${DATABASE_PASSWORD}
    depends_on:
      - database
    networks:
      - internal
      - traefik
    labels:
      - traefik.enable=true
      # Main router; translate.xila.dev redirects to translate.anneraud.fr
      - traefik.http.routers.tolgee.rule=Host(`translate.anneraud.fr`) || Host(`translate.xila.dev`)
      - traefik.http.routers.tolgee.entrypoints=web-secure
      - traefik.http.routers.tolgee.tls=true
      - traefik.http.routers.tolgee.tls.certResolver=letsencrypt
      - traefik.http.services.tolgee.loadbalancer.server.port=8080

      - traefik.http.routers.tolgee.middlewares=tolgee-redirection
      - traefik.http.middlewares.tolgee-redirection.redirectregex.regex=^https?://translate.xila.dev/(.*)
      - traefik.http.middlewares.tolgee-redirection.redirectregex.replacement=https://translate.anneraud.fr/$$1

      # Logins (POST /api/public/generatetoken) get their own router, rate
      # limited per client address: a burst of 10, then one every 6 s (as the
      # Bruxelles logins, inventory/host_vars/bruxelles/traefik.yml)
      # yamllint disable-line rule:line-length
      - traefik.http.routers.tolgee-login.rule=Host(`translate.anneraud.fr`) && Method(`POST`) && PathPrefix(`/api/public/generatetoken`)
      - traefik.http.routers.tolgee-login.entrypoints=web-secure
      - traefik.http.routers.tolgee-login.tls=true
      - traefik.http.routers.tolgee-login.service=tolgee
      - traefik.http.routers.tolgee-login.middlewares=tolgee-login-rate-limit
      - traefik.http.middlewares.tolgee-login-rate-limit.ratelimit.average=10
      - traefik.http.middlewares.tolgee-login-rate-limit.ratelimit.period=1m
      - traefik.http.middlewares.tolgee-login-rate-limit.ratelimit.burst=10
      - traefik.http.middlewares.tolgee-login-rate-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64

  database:
    image: postgres:18.6
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    volumes:
      - ./postgres_data:/var/lib/postgresql
    networks:
      - internal

  pgbackups:
    image: prodrigestivill/postgres-backup-local:18-debian-d257e5d
    logging: *logging
    restart: always
    # user: postgres:postgres # Optional: see below
    volumes:
      - ./postgres_backup:/backups
    networks:
      - internal
    depends_on:
      - database
    environment:
      - POSTGRES_HOST=database
      - POSTGRES_DB=${DATABASE_NAME}
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      - POSTGRES_EXTRA_OPTS=-Z1 --schema=public --blobs
      - SCHEDULE=@daily
      - BACKUP_ON_START=TRUE
      - BACKUP_KEEP_DAYS=7
      - BACKUP_KEEP_WEEKS=4
      - BACKUP_KEEP_MONTHS=6
      - HEALTHCHECK_PORT=8080

networks:
  # Database side only: no route out of the Docker network
  internal:
    internal: true
  traefik:
    external: true
