name: zitadel

# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.20.0
    logging: *logging
    restart: unless-stopped
    user: "991:991"
    command: start-from-init --masterkey "${ZITADEL_MASTERKEY}"
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: ${ZITADEL_DOMAIN}
      ZITADEL_EXTERNALPORT: 443
      ZITADEL_EXTERNALSECURE: true
      ZITADEL_TLS_ENABLED: false
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: true
      ZITADEL_FIRSTINSTANCE_LOGINCLIENTPATPATH: /zitadel/bootstrap/login-client.pat
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_USERNAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_MACHINE_NAME: login-client
      ZITADEL_FIRSTINSTANCE_ORG_LOGINCLIENT_PAT_EXPIRATIONDATE: ${LOGIN_CLIENT_PAT_EXPIRATION}
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_REQUIRED: true
      ZITADEL_DEFAULTINSTANCE_FEATURES_LOGINV2_BASEURI: https://${ZITADEL_DOMAIN}/ui/v2/login/
      ZITADEL_OIDC_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/login?authRequest=
      ZITADEL_OIDC_DEFAULTLOGOUTURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/logout?post_logout_redirect=
      ZITADEL_SAML_DEFAULTLOGINURLV2: https://${ZITADEL_DOMAIN}/ui/v2/login/login?samlRequest=
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: true
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 10s
      timeout: 30s
      retries: 12
      start_period: 20s
    volumes:
      - ./Zitadel_bootstrap:/zitadel/bootstrap
    networks:
      - internal
      - proxy
    # Logins (POST to the login pages, case-insensitive) get their own router,
    # which only adds a rate limit per client address (an IPv6 client counts as
    # its /64); the limits come from inventory/host_vars/bruxelles/traefik.yml
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      - traefik.http.routers.zitadel.rule=Host(`authentification.anneraud.fr`)
      - traefik.http.routers.zitadel.entrypoints=web-secure
      - traefik.http.routers.zitadel.tls=true
      - traefik.http.routers.zitadel.service=zitadel
      # HTTP/2 end to end: Zitadel's gRPC API (used by its OpenTofu provider) needs it
      - traefik.http.services.zitadel.loadbalancer.server.scheme=h2c
      - traefik.http.services.zitadel.loadbalancer.server.port=8080
      # Former login pages, still served
      - traefik.http.routers.zitadel-login.rule=(Host(`authentification.anneraud.fr`)) && Method(`POST`) && (PathRegexp(`(?i)^/ui/login`))
      - traefik.http.routers.zitadel-login.entrypoints=web-secure
      - traefik.http.routers.zitadel-login.tls=true
      - traefik.http.routers.zitadel-login.service=zitadel
      - traefik.http.routers.zitadel-login.middlewares=zitadel-login-rate-limit
      - traefik.http.middlewares.zitadel-login-rate-limit.ratelimit.average=${TRAEFIK_LOGIN_RATE_LIMIT_AVERAGE:?}
      - traefik.http.middlewares.zitadel-login-rate-limit.ratelimit.period=${TRAEFIK_LOGIN_RATE_LIMIT_PERIOD:?}
      - traefik.http.middlewares.zitadel-login-rate-limit.ratelimit.burst=${TRAEFIK_LOGIN_RATE_LIMIT_BURST:?}
      - traefik.http.middlewares.zitadel-login-rate-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
    depends_on:
      postgres:
        condition: service_healthy

  login:
    image: ghcr.io/zitadel/zitadel-login:v4.20.0
    logging: *logging
    restart: unless-stopped
    user: "991:991"
    environment:
      ZITADEL_API_URL: http://zitadel:8080
      NEXT_PUBLIC_BASE_PATH: /ui/v2/login
      ZITADEL_SERVICE_USER_TOKEN_FILE: /zitadel/bootstrap/login-client.pat
      CUSTOM_REQUEST_HEADERS: Host:${ZITADEL_DOMAIN},X-Forwarded-Proto:https
    volumes:
      - ./Zitadel_bootstrap:/zitadel/bootstrap:ro
    networks:
      - internal
      - proxy
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      - traefik.http.routers.zitadel-1.rule=(Host(`authentification.anneraud.fr`)) && PathPrefix(`/ui/v2/login`)
      - traefik.http.routers.zitadel-1.entrypoints=web-secure
      - traefik.http.routers.zitadel-1.tls=true
      - traefik.http.routers.zitadel-1.service=zitadel-1
      - traefik.http.services.zitadel-1.loadbalancer.server.port=3000
      # Every step of the login (name, password, second factor…) posts a form
      # here, a few per login: the busy login limit
      # yamllint disable-line rule:line-length
      - traefik.http.routers.zitadel-1-login.rule=((Host(`authentification.anneraud.fr`)) && PathPrefix(`/ui/v2/login`)) && Method(`POST`) && (PathRegexp(`(?i)^/ui/v2/login`))
      - traefik.http.routers.zitadel-1-login.entrypoints=web-secure
      - traefik.http.routers.zitadel-1-login.tls=true
      - traefik.http.routers.zitadel-1-login.service=zitadel-1
      - traefik.http.routers.zitadel-1-login.middlewares=zitadel-1-login-rate-limit
      - traefik.http.middlewares.zitadel-1-login-rate-limit.ratelimit.average=${TRAEFIK_BUSY_LOGIN_RATE_LIMIT_AVERAGE:?}
      - traefik.http.middlewares.zitadel-1-login-rate-limit.ratelimit.period=${TRAEFIK_BUSY_LOGIN_RATE_LIMIT_PERIOD:?}
      - traefik.http.middlewares.zitadel-1-login-rate-limit.ratelimit.burst=${TRAEFIK_BUSY_LOGIN_RATE_LIMIT_BURST:?}
      - traefik.http.middlewares.zitadel-1-login-rate-limit.ratelimit.sourcecriterion.ipstrategy.ipv6subnet=64
    depends_on:
      zitadel:
        condition: service_healthy

  postgres:
    image: postgres:18.6-alpine
    logging: *logging
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./Postgres:/var/lib/postgresql
    networks:
      - internal
      - databases

networks:
  # Database side only: no route out of the Docker network
  internal:
    internal: true
  # Shared with Databasus, which backs the databases up; created by the
  # compose_service role (compose_service_external_networks)
  databases:
    external: true
  proxy:
    name: "${PROXY_NETWORK}"
    external: true
