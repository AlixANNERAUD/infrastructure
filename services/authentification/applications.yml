---
- name: Provision the Anneraud Zitadel organization
  hosts: localhost
  gather_facts: false
  vars:
    zitadel_issuer: https://authentification.anneraud.fr
    zitadel_secret_directory: "{{ lookup('ansible.builtin.env', 'HOME') }}/.config/infrastructure/zitadel"
  vars_files:
    - ../../vault/authentification/vault.yml
  roles:
    - role: zitadel
  tasks:
    - name: Hand over the credentials of each application
      when: zitadel_provisioned
      block:
        - name: Create the folder for the client secrets
          ansible.builtin.file:
            path: "{{ zitadel_secret_directory }}"
            state: directory
            mode: "0700"

        # Only written when absent or different, so a second run changes nothing
        - name: Write the client secrets
          ansible.builtin.copy:
            dest: "{{ zitadel_secret_directory }}/{{ item.key }}.secret"
            content: "{{ item.value }}"
            mode: "0600"
          loop: "{{ zitadel_client_secrets | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          no_log: true

        # Handed over by the owner, changed at first login. Zitadel only uses it
        # when it creates the user, so the file always matches the state
        - name: Write the temporary passwords
          ansible.builtin.copy:
            dest: "{{ zitadel_secret_directory }}/{{ item.key }}.password"
            content: "{{ item.value }}"
            mode: "0600"
          loop: "{{ zitadel_temporary_passwords | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
          no_log: true

        - name: Show where the temporary passwords are
          ansible.builtin.debug:
            msg: "Temporary password of {{ item }}: {{ zitadel_secret_directory }}/{{ item }}.password (changed at first login)"
          loop: "{{ zitadel_temporary_passwords.keys() | list }}"

        - name: Show where to paste the credentials
          ansible.builtin.debug:
            msg: >-
              {{ [
                   item.key ~ ' (configured in ' ~ item.value ~ ')',
                   'Issuer: ' ~ zitadel_issuer,
                   'Client id: ' ~ zitadel_client_ids[item.key]
                 ] + ([
                   'Client secret file: ' ~ zitadel_secret_directory ~ '/' ~ item.key ~ '.secret'
                 ] if item.key in zitadel_client_secrets else []) }}
          loop: "{{ zitadel_configured_in | dict2items }}"
          loop_control:
            label: "{{ item.key }}"
