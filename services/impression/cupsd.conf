# cupsd.conf of services/impression, from recto's examples/cups/cupsd.conf
# (https://github.com/AlixANNERAUD/recto/blob/v0.1.4/examples/cups/cupsd.conf).
#
# recto reaches CUPS by the name "cups" on the stack's network, so CUPS must
# accept any Host header (ServerAlias *): without it CUPS answers recto with
# 400 and every page shows the printing service as unavailable.
Listen 0.0.0.0:631
# The local socket is where root and recto administer CUPS, without a password (cups-files.conf).
# compose.yml shares it with recto through a volume.
Listen /run/cups/cups.sock
ServerAlias *
LogLevel warn
PageLogFormat

WebInterface No
DefaultAuthType Basic
MaxLogSize 0

# Only the stack's own network and the container itself may print and see
# the queues. CUPS is on no other network and never published, so the
# addresses that reach it are recto's; the stack's network has an automatic
# subnet, inside Docker's private range.
<Location />
  Order allow,deny
  Allow from 127.0.0.1
  Allow from 172.16.0.0/12
</Location>

# Adding and removing printers stays restricted to the SystemGroup of cups-files.conf (root and
# recto), over the local socket.
<Location /admin>
  Order allow,deny
  AuthType Default
  Require user @SYSTEM
</Location>

<Location /admin/conf>
  Order allow,deny
  AuthType Default
  Require user @SYSTEM
</Location>

<Policy default>
  # recto shows jobs of every user, so job attributes must not be hidden from other users.
  JobPrivateAccess all
  JobPrivateValues none
  SubscriptionPrivateAccess all
  SubscriptionPrivateValues none

  <Limit Create-Job Print-Job Print-URI Validate-Job>
    Order deny,allow
  </Limit>

  <Limit Send-Document Send-URI Hold-Job Release-Job Restart-Job Purge-Jobs Set-Job-Attributes Create-Job-Subscription Renew-Subscription Cancel-Subscription Get-Notifications Reprocess-Job Cancel-Current-Job Suspend-Current-Job Resume-Job Cancel-My-Jobs Close-Job CUPS-Move-Job CUPS-Get-Document>
    Order deny,allow
  </Limit>

  # Recto cancels on behalf of the signed-in user, so any client on the network may cancel.
  <Limit Cancel-Job>
    Order deny,allow
  </Limit>

  <Limit CUPS-Add-Modify-Printer CUPS-Delete-Printer CUPS-Add-Modify-Class CUPS-Delete-Class CUPS-Set-Default CUPS-Get-Devices>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit Pause-Printer Resume-Printer Enable-Printer Disable-Printer Pause-Printer-After-Current-Job Hold-New-Jobs Release-Held-New-Jobs Deactivate-Printer Activate-Printer Restart-Printer Shutdown-Printer Startup-Printer Promote-Job Schedule-Job-After Cancel-Jobs CUPS-Accept-Jobs CUPS-Reject-Jobs>
    AuthType Default
    Require user @SYSTEM
    Order deny,allow
  </Limit>

  <Limit All>
    Order deny,allow
  </Limit>
</Policy>
