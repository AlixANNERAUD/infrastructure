# SANE backends libsane loads in recto, one per line (from recto's
# examples/sane/dll.conf). Debian's default enables every installed backend
# and probes USB for each, which is slow in a container:
#   airscan  network scanners that speak eSCL or WSD, found over the LAN
#            (the macvlan address carries multicast)
#   escl     the sane-escl backend, an alternative for eSCL scanners
airscan
escl
