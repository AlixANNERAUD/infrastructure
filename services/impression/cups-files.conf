# cups-files.conf of services/impression, from recto's examples/cups/cups-files.conf
# (https://github.com/AlixANNERAUD/recto/blob/v0.1.4/examples/cups/cups-files.conf).
#
# The olbat/cupsd image ships a user `print` (password `print`) in the `lpadmin` group, and the
# default SystemGroup is `root lpadmin`: anyone who can reach port 631 could then add or remove
# printers with those well-known credentials. Here administration is only possible over the local
# socket, by peer credentials (PeerCred): root (`docker compose exec cups lpadmin ...`) and the
# `recto` account that compose.yml's entrypoint creates, which is how recto manages printers. Administration
# over TCP is always refused.
#
# Keep root first: CUPS gives the local root certificate the group of the first SystemGroup entry,
# so with `recto` first, recto could read root's certificate and act as root. Never add a group
# whose users have a password (such as lpadmin or print): those could then administer over TCP.
# Use group names, not numbers, which CUPS refuses.
SystemGroup root recto
PeerCred on
LogFileGroup adm
AccessLog /var/log/cups/access_log
ErrorLog /var/log/cups/error_log
PageLog /var/log/cups/page_log
