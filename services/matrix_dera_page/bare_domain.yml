---
# Temporarily serve dera.page from Luxembourg while the friend's server is down,
# so /.well-known/matrix/* keeps working. Switch back with:
#   ansible-playbook bare_domain.yml -e bare_domain_target=friend
- name: Point dera.page bare domain
  hosts: matrix_dera_page
  gather_facts: false
  vars:
    bare_domain_target: luxembourg
    # The friend's home addresses are personal data: kept in the vault, not in this public repo
    friend_records:
      - type: A
        value: "{{ dera_page_friend_ipv4 }}"
      - type: AAAA
        value: "{{ dera_page_friend_ipv6 }}"
  vars_files:
    - ../../vault/matrix_dera_page/vault.yml
    - ../../vault/cloudflare/vault.yml
  tasks:
    - name: Check that the friend's addresses are in the vault
      ansible.builtin.assert:
        that:
          - dera_page_friend_ipv4 is defined
          - dera_page_friend_ipv6 is defined
        fail_msg: Add dera_page_friend_ipv4 and dera_page_friend_ipv6 to vault/matrix_dera_page/vault.yml.
        quiet: true

    - name: Remove friend's records
      community.general.cloudflare_dns:
        zone: dera.page
        account_email: "{{ cloudflare_email }}"
        account_api_key: "{{ cloudflare_api_key }}"
        type: "{{ item.type }}"
        record: dera.page
        value: "{{ item.value }}"
        state: absent
      loop: "{{ friend_records }}"
      when: bare_domain_target == "luxembourg"

    - name: Point bare domain to Luxembourg
      community.general.cloudflare_dns:
        zone: dera.page
        account_email: "{{ cloudflare_email }}"
        account_api_key: "{{ cloudflare_api_key }}"
        type: CNAME
        record: dera.page
        value: "{{ global_dns_host }}"
      when: bare_domain_target == "luxembourg"

    - name: Remove Luxembourg record
      community.general.cloudflare_dns:
        zone: dera.page
        account_email: "{{ cloudflare_email }}"
        account_api_key: "{{ cloudflare_api_key }}"
        type: CNAME
        record: dera.page
        value: "{{ global_dns_host }}"
        state: absent
      when: bare_domain_target == "friend"

    - name: Restore friend's records
      community.general.cloudflare_dns:
        zone: dera.page
        account_email: "{{ cloudflare_email }}"
        account_api_key: "{{ cloudflare_api_key }}"
        type: "{{ item.type }}"
        record: dera.page
        value: "{{ item.value }}"
      loop: "{{ friend_records }}"
      when: bare_domain_target == "friend"
