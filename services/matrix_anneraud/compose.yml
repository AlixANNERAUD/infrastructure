# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  synapse:
    image: docker.io/matrixdotorg/synapse:v1.163.2
    logging: *logging
    # Since synapse does not retry to connect to the database, restart upon
    # failure
    restart: unless-stopped
    # See the readme for a full documentation of the environment settings
    # NOTE: You must edit homeserver.yaml to use postgres, it defaults to sqlite
    volumes:
      - ./Synapse_data:/data
    depends_on:
      - database
    networks:
      - internal
      - proxy
    # One Traefik service per router, so that each keeps its own metrics.
    # Federation goes through port 443 (the web-secure entrypoint): Bruxelles
    # does not publish the federation port, and Synapse's well-known advertises
    # anneraud.fr:443
    labels:
      - traefik.enable=true
      - traefik.docker.network=${PROXY_NETWORK}
      - traefik.http.routers.synapse.rule=Host(`matrix.anneraud.fr`)
      - traefik.http.routers.synapse.entrypoints=web-secure
      - traefik.http.routers.synapse.tls=true
      - traefik.http.routers.synapse.service=synapse
      - traefik.http.services.synapse.loadbalancer.server.port=8008
      # The admin API stays internal while the rest of matrix.anneraud.fr is public
      - traefik.http.routers.synapse-1.rule=(Host(`matrix.anneraud.fr`)) && PathPrefix(`/_synapse/admin`)
      - traefik.http.routers.synapse-1.entrypoints=web-secure
      - traefik.http.routers.synapse-1.tls=true
      - traefik.http.routers.synapse-1.service=synapse-1
      - traefik.http.routers.synapse-1.middlewares=internal-allowlist@file
      - traefik.http.services.synapse-1.loadbalancer.server.port=8008
      # Matrix delegation for @…:anneraud.fr; the rest of anneraud.fr redirects
      # to www (redirect-anneraud, inventory/host_vars/bruxelles/traefik.yml).
      # Synapse's served well-known advertises anneraud.fr:443 (its
      # server_name), so other servers send federation requests to
      # anneraud.fr/_matrix as well
      - traefik.http.routers.matrix-delegation.rule=(Host(`anneraud.fr`)) && PathPrefix(`/.well-known/matrix`)
      - traefik.http.routers.matrix-delegation.entrypoints=web-secure
      - traefik.http.routers.matrix-delegation.tls=true
      - traefik.http.routers.matrix-delegation.service=matrix-delegation
      - traefik.http.services.matrix-delegation.loadbalancer.server.port=8008
      - traefik.http.routers.matrix-delegation-1.rule=(Host(`anneraud.fr`)) && PathPrefix(`/_matrix`)
      - traefik.http.routers.matrix-delegation-1.entrypoints=web-secure
      - traefik.http.routers.matrix-delegation-1.tls=true
      - traefik.http.routers.matrix-delegation-1.service=matrix-delegation-1
      - traefik.http.services.matrix-delegation-1.loadbalancer.server.port=8008

  database:
    image: docker.io/postgres:18.6
    logging: *logging
    restart: unless-stopped
    # Change that password, of course!
    environment:
      - POSTGRES_USER=${DATABASE_USER}
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD}
      # ensure the database gets created correctly
      # https://element-hq.github.io/synapse/latest/postgres.html#set-up-database
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    volumes:
      # You may store the database tables in a local folder..
      - ./Postgres_data:/var/lib/postgresql
      # .. or store them on some high performance storage for better results
      # - /path/to/ssd/storage:/var/lib/postgresql/data
    networks:
      - internal
      - databases

networks:
  # Database side only: no route out of the Docker network
  internal:
    internal: true
  # Shared with Databasus, which backs the databases up; created by the
  # compose_service role (compose_service_external_networks)
  databases:
    external: true
  proxy:
    name: "${PROXY_NETWORK}"
    external: true
