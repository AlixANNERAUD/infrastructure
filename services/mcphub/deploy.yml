---
- name: Deploy MCPHub
  hosts: mcphub
  become: true
  vars_files:
    - ../../vault/ansible/vault.yml
    - ../../vault/mcphub/vault.yml
    - ../../vault/cloudflare/vault.yml
  pre_tasks:
    # Without the Zitadel credentials the client is empty: the Zitadel login
    # stays off and MCPHub keeps only its local admin login
    - name: Get MCPHub's Zitadel login
      ansible.builtin.include_role:
        name: zitadel
        tasks_from: login
      vars:
        zitadel_login_application: mcphub
        zitadel_login_environment_file: "{{ services_root }}/MCPHub/.env"
        zitadel_login_client_id_variable: OIDC_CLIENT_ID
        zitadel_login_client_secret_variable: OIDC_CLIENT_SECRET

  roles:
    - role: compose_service
      vars:
        compose_service_name: mcphub
        compose_service_directory: MCPHub
        compose_service_directories:
          - Data   # TrueNAS dataset, like Postgres
          - Postgres
        compose_service_external_networks:
          - name: databases   # shared with Databasus
            internal: true
        compose_service_environment:
          POSTGRES_DB: mcphub
          POSTGRES_USER: mcphub
          POSTGRES_PASSWORD: "{{ mcphub_database_password }}"
          JWT_SECRET: "{{ mcphub_jwt_secret }}"
          BETTER_AUTH_SECRET: "{{ mcphub_better_auth_secret }}"
          ADMIN_PASSWORD: "{{ mcphub_admin_password }}"
          OIDC_ENABLED: "{{ (zitadel_login_client_id | length > 0) | string | lower }}"
          OIDC_CLIENT_ID: "{{ zitadel_login_client_id }}"
          OIDC_CLIENT_SECRET: "{{ zitadel_login_client_secret }}"
        compose_service_dns_records:
          - record: mcphub.anneraud.fr
            visibility: private
