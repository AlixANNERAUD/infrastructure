# Container logs are unbounded by default and would fill the disk
x-logging: &logging
  driver: local
  options:
    max-size: "20m"
    max-file: "3"

services:
  mcphub:
    image: samanhappy/mcphub:1.1.10
    logging: *logging
    restart: unless-stopped
    volumes:
      - ./data:/app/data
    networks:
      - proxy
    labels:
      - traefik.enable=true
      - traefik.http.routers.mcphub.rule=Host(`mcphub.anneraud.fr`)
      - traefik.http.routers.mcphub.entrypoints=web-secure
      - traefik.http.routers.mcphub.tls=true
      - traefik.http.routers.mcphub.middlewares=internal-allowlist@file
      - traefik.http.services.mcphub.loadbalancer.server.port=3000

networks:
  proxy:
    external: true
